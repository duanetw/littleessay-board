<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<title>小論文經典追蹤板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">

<style>
:root{
  color-scheme:dark;
  --ground:#0e1218;
  --surface:#161c25;
  --surface-2:#1a212b;
  --surface-3:#212a36;
  --line:#262f3c;
  --line-strong:#36414f;
  --ink:#e7ecf3;
  --ink-2:#a9b3c2;
  --ink-3:#727e8e;
  --accent:#89a9dd;
  --accent-soft:rgba(137,169,221,.14);
  --pos:#41c08c;
  --pos-soft:65,192,140;
  --neg:#e29c45;
  --neg-soft:226,156,69;
  --flat:#6d7887;
  --warn:#ef7462;
  --warn-soft:rgba(239,116,98,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
  --r:10px;
  --sans:"Noto Sans TC",-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC",Georgia,"Songti TC",serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",monospace;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px 72px}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.top-in{--pad:20px;max-width:1400px;margin:0 auto;padding:16px var(--pad) 0;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{
  font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:.02em;
  margin:0;line-height:1.2;
}
.brand .sub{color:var(--ink-3);font-size:12.5px;letter-spacing:.04em}
.brand .sub b{color:var(--ink-2);font-weight:500;font-family:var(--mono)}

/* 追蹤板 / 週報 切換 */
.modes{
  display:flex;gap:2px;margin-left:auto;align-self:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;
}
.mode{
  appearance:none;border:0;background:none;cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-3);
  padding:5px 15px;border-radius:6px;
}
.mode:hover{color:var(--ink-2)}
.mode[aria-selected="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:2px;align-items:flex-end}
.tab{
  appearance:none;border:0;background:none;cursor:pointer;
  font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink-3);
  padding:9px 16px 11px;border-bottom:2px solid transparent;
  display:flex;align-items:center;gap:7px;
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab .n{
  font-family:var(--mono);font-size:11px;color:var(--ink-3);
  background:var(--surface-3);border-radius:20px;padding:1px 7px;
}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:6px 6px 0 0}

/* ---------- 週報跑馬燈 ---------- */
/* 追蹤板頂上的橫帶：這個市場的週報提過哪些股，新的排前面。
   自己會走，滑鼠移上去就停，也可以直接用滾輪或手指撥。 */
.trail{
  position:relative;display:flex;align-items:stretch;margin:20px 0 0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow);
}
.trail .tlab{
  flex:0 0 auto;display:flex;align-items:center;padding:0 13px;
  border-right:1px solid var(--line);background:var(--surface-2);
  font-size:11px;letter-spacing:.09em;color:var(--ink-3);white-space:nowrap;
}
.trail-clip{
  position:relative;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;
}
.trail-clip::-webkit-scrollbar{display:none}
.trail-track{display:flex;width:max-content;gap:6px;padding:9px 13px}
/* 右緣淡出，暗示後面還有 */
.trail .tfade{
  position:absolute;top:1px;right:0;bottom:1px;width:36px;pointer-events:none;
  background:linear-gradient(to left,var(--surface),transparent);
}
.tk{
  appearance:none;border:0;cursor:pointer;font-family:var(--sans);
  font-size:11.5px;color:var(--ink-2);background:var(--surface-3);
  border-radius:5px;padding:3px 9px;white-space:nowrap;
}
.tk:hover{color:var(--ink);background:var(--line-strong)}
.tk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tk b{font-family:var(--mono);font-weight:500;color:var(--ink-3);margin-right:4px}
.tk:hover b{color:var(--ink-2)}
.tk .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-left:5px}
.tk.hot{color:var(--neg);background:rgba(var(--neg-soft),.13)}
.tk.hot b{color:var(--neg);opacity:.75}
.tk.clown{color:var(--ink-3)}
/* Stage 徽章：顏色跟表格裡的 Stage 欄一致，掃過去是同一套語彙 */
.tk .sg{
  display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;
  font-family:var(--mono);font-size:10px;
  color:var(--ink-2);background:var(--surface-2);
}
.tk.s2 .sg{color:var(--pos);background:rgba(var(--pos-soft),.16)}
.tk.s3 .sg{color:var(--neg);background:rgba(var(--neg-soft),.16)}
.tk.s4 .sg{color:var(--warn);background:var(--warn-soft)}
/* 點跑馬燈跳到表格裡那一列時閃一下，否則在幾十列裡找不到自己剛點的是哪一列 */
@keyframes trail-flash{from{background:var(--accent-soft)}to{background:transparent}}
tbody tr.flash > td{animation:trail-flash 2.2s ease-out}
@media (hover:none), (max-width:700px){
  /* 手指比游標粗：沒有滑鼠的裝置（含平板）把可點範圍加大 */
  .trail-track{gap:7px;padding:8px 12px}
  .tk{padding:6px 11px;font-size:12px}
}
@media (max-width:700px){
  .trail .tlab{padding:0 11px;font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){
  tbody tr.flash > td{animation:none;background:var(--accent-soft)}
}

/* ---------- stats ---------- */
.stats{
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin:26px 0 20px;box-shadow:var(--shadow);
}
.stat{background:var(--surface);padding:13px 16px 14px;display:flex;flex-direction:column;gap:3px}
.stat .k{font-size:11px;letter-spacing:.09em;color:var(--ink-3);text-transform:uppercase}
.stat .v{font-family:var(--mono);font-size:23px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--ink-3);margin-left:3px;font-weight:400}
.stat.pos .v{color:var(--pos)}
.stat.neg .v{color:var(--neg)}
.stat.warn .v{color:var(--warn)}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{position:relative;flex:0 0 232px}
.search input{
  width:100%;font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;
  padding:8px 11px 8px 31px;
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.toggle{
  appearance:none;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink-2);font-family:var(--sans);font-size:13px;cursor:pointer;
  padding:7px 13px;border-radius:8px;display:flex;align-items:center;gap:6px;
}
.toggle:hover{border-color:var(--ink-3)}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.75}
/* 追蹤欄位 / Pine Stage 視圖切換 */
.views{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px}
.views[hidden]{display:none}
.vbtn{
  appearance:none;border:0;background:none;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-3);
  padding:4px 12px;border-radius:6px;
}
.vbtn:hover{color:var(--ink-2)}
.vbtn[aria-selected="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.vbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Weinstein 四階段：1 基底、2 上升、3 頭部、4 下跌。
   沿用表上既有的訊號色軸，不另外發明一套。 */
td.stg span{
  display:inline-block;min-width:22px;padding:2px 7px;border-radius:5px;
  font-family:var(--mono);font-size:12px;font-weight:700;text-align:center;
}
td.stg.s1 span{color:var(--ink-2);background:var(--surface-3)}
td.stg.s2 span{color:var(--pos);background:rgba(var(--pos-soft),.16)}
td.stg.s3 span{color:var(--neg);background:rgba(var(--neg-soft),.16)}
td.stg.s4 span{color:var(--warn);background:var(--warn-soft)}
td.stg.s0 span{color:var(--flat);background:var(--surface-3);opacity:.6}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
td.val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-3)}
.flag{
  display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:20px;border-radius:5px;font-size:11px;font-weight:700;
  color:var(--accent);background:var(--accent-soft);
}
.flag.off{color:var(--flat);background:none;opacity:.35;font-weight:400}
.nomaster{color:var(--ink-3);font-size:12px;opacity:.55}

.spacer{flex:1}
.count{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* 兩組快篩鈕依視圖切換。display:contents 不能寫在 inline style：
   inline 的 display 會蓋過 [hidden]，另一組就永遠藏不起來 */
#maToggles:not([hidden]),#stageToggles:not([hidden]){display:contents}

.groups{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.gchip{
  appearance:none;cursor:pointer;font-family:var(--sans);font-size:12.5px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  padding:4px 11px;border-radius:20px;
}
.gchip:hover{border-color:var(--line-strong)}
.gchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.gchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gchip .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:5px}
.gchip[aria-pressed="true"] .n{color:var(--surface);opacity:.7}
/* 在目前的搜尋／快篩／Stage 條件下一檔都沒有：點了只會是空表，淡掉 */
.gchip.zero{opacity:.4}
/* 第二層：選了大類之後才出現的細分族群 */
.subs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-10px 0 18px}
.subs .lbl{font-size:11px;color:var(--ink-3);letter-spacing:.08em;margin-right:1px}
.schip{
  appearance:none;cursor:pointer;font-family:var(--sans);font-size:12px;
  border:1px dashed var(--line-strong);background:transparent;color:var(--ink-3);
  padding:3px 10px;border-radius:20px;
}
.schip:hover{color:var(--ink-2);border-color:var(--ink-3)}
.schip[aria-pressed="true"]{
  background:var(--accent-soft);border-style:solid;border-color:var(--accent);
  color:var(--accent);font-weight:500;
}
.schip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- table ---------- */
.tablecard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);
}
/* 桌機不加 overflow，否則 sticky thead 會被關進捲動容器裡而釘不住 */
.tscroll{border-radius:var(--r)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1088px;table-layout:auto}
thead th{
  position:sticky;z-index:5;
  background:var(--surface-2);
  font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:.04em;
  text-align:right;padding:8px 7px;white-space:nowrap;
  border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;
}
thead tr:first-child th{top:var(--head-h,0px)}
thead tr:nth-child(2) th{top:calc(var(--head-h,0px) + var(--hrow-h,24px))}
thead th:hover{color:var(--ink)}
thead th.lt{text-align:left}
thead th.grp{
  font-size:10px;letter-spacing:.1em;
  text-align:center;color:var(--ink-3);background:var(--surface-3);
  cursor:default;padding:5px 8px;
}
thead th.grp:hover{color:var(--ink-3)}
thead th.span2{background:var(--surface-3)}
th .ar{opacity:0;margin-left:3px;font-size:9px}
th[data-dir] .ar{opacity:1;color:var(--accent)}
tbody td{
  padding:7px 7px;border-bottom:1px solid var(--line);
  font-size:13px;text-align:right;white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.sticky,th.sticky{
  position:sticky;left:0;z-index:6;background:var(--surface);
  text-align:left;border-right:1px solid var(--line);padding-left:12px;
}
thead th.sticky{z-index:8;background:var(--surface-2)}
tbody tr:hover td.sticky{background:var(--surface-2)}
/* 卡片圓角：沒有 overflow:hidden 可用，改讓角落儲存格自己圓 */
thead tr:first-child th:first-child{border-top-left-radius:var(--r)}
thead tr:first-child th:last-child{border-top-right-radius:var(--r)}
tbody tr:last-child td:first-child{border-bottom-left-radius:var(--r)}
tbody tr:last-child td:last-child{border-bottom-right-radius:var(--r)}
/* 個股欄的來源：入選是自己進過榜的，要跳出來；龍頭只是補進來的背景，壓低。
   用 inset box-shadow 當左側標記而不是 border，才不會動到欄寬。
   刻意避開綠／橘——那兩色在這張表已經是斜率與穿越的訊號色。 */
/* 首欄是 sticky 的，底色一定要不透明——半透明會讓橫向捲動時後面的數字透出來，
   跟股票名稱疊在一起（龍頭沒事，是因為它沿用 td.sticky 的實色底）。
   疊一層實色漸層在 surface 上，效果等同半透明但保持不透明。 */
td.sticky.pick{
  box-shadow:inset 3px 0 0 var(--accent);
  background:linear-gradient(rgba(137,169,221,.10),rgba(137,169,221,.10)),var(--surface);
}
tbody tr:hover td.sticky.pick{
  background:linear-gradient(rgba(137,169,221,.16),rgba(137,169,221,.16)),var(--surface-2);
}
td.sticky.pick .c{color:var(--ink);font-weight:700}
td.sticky.lead{box-shadow:inset 2px 0 0 var(--line-strong)}
td.sticky.lead .c,td.sticky.lead .nm{color:var(--ink-3)}

.srclegend{display:flex;gap:16px;align-items:center;margin:0 0 10px;font-size:11.5px}
.srclegend[hidden]{display:none}
.sl{display:flex;align-items:center;gap:6px}
.sl i{display:inline-block;width:3px;height:13px;border-radius:2px}
.sl.pick{color:var(--ink-2);font-weight:500}
.sl.pick i{background:var(--accent)}
.sl.lead{color:var(--ink-3)}
.sl.lead i{background:var(--line-strong);width:2px}
.sl small{color:var(--ink-3);font-weight:400}

.tick{display:flex;flex-direction:column;gap:0;line-height:1.25}
.tick .c{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.01em}
.tick .nm{
  font-size:11.5px;color:var(--ink-3);
  max-width:116px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chip{
  display:inline-block;font-size:11px;color:var(--ink-2);
  background:var(--surface-3);border-radius:5px;padding:2px 7px;white-space:nowrap;
  max-width:104px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;
}
td.slope{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500}
td.sep{border-left:1px solid var(--line)}
thead th.sep{border-left:1px solid var(--line)}
.x{
  display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:20px;border-radius:5px;font-size:12px;font-weight:700;
}
thead th.xc,tbody td.xc{padding-left:4px;padding-right:4px}
/* 營收年增%：正綠負橘，底色深淺隨幅度（40% 封頂） */
td.rev{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500}
.x.up{color:var(--pos);background:rgba(var(--pos-soft),.14)}
.x.dn{color:var(--neg);background:rgba(var(--neg-soft),.15)}
.x.no{color:var(--flat);opacity:.35;font-weight:400}
/* 剛變化：0~1 個交易日內穿的，除了底色最濃，再加一圈同色外框 */
.x.fresh{box-shadow:inset 0 0 0 1.5px currentColor}
td.days{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
td.days.soon{color:var(--warn);font-weight:600;background:var(--warn-soft)}
/* 距 52 週新高幾週：0＝本週創高，越大越久沒創高（分級同圖例） */
td.w52{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
td.w52 span{
  display:inline-block;min-width:26px;padding:2px 6px;border-radius:5px;text-align:center;
}
td.w52.new span{color:var(--pos);background:rgba(var(--pos-soft),.22);font-weight:700}
td.w52.hot span{color:var(--pos);background:rgba(var(--pos-soft),.12)}
td.w52.mid span{color:var(--ink-3);background:var(--surface-3)}
td.w52.cold span{color:var(--neg);background:rgba(var(--neg-soft),.16);font-weight:700}
/* ---------- 自導自演 ---------- */
/* 紙上帳戶的戰情頁：現在的持股與停損停利、資金曲線、交易紀錄、每天那則訊息。
   表格另外開一個 class——追蹤板的 table 規則（最小寬度、釘住的表頭）這裡都不適用。 */
.ap-sec{margin:26px 0 0}
.ap-sec > h2{
  font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.03em;
  margin:0 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
}
.ap-sec > h2 small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.ap-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.ap-scroll{overflow-x:auto;border-radius:var(--r)}
table.ap-t{min-width:0;width:100%}
table.ap-t thead th{position:static;cursor:default;padding:8px 12px}
table.ap-t thead th:hover{color:var(--ink-3)}
table.ap-t tbody td{padding:8px 12px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
table.ap-t td.lt, table.ap-t th.lt{text-align:left}
table.ap-t td.nm{font-family:var(--sans);font-size:13.5px;font-weight:500}
table.ap-t td.nm small{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:6px;font-weight:400}
table.ap-t td.why{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);white-space:normal;min-width:220px;text-align:left}
table.ap-t td small{color:var(--ink-3);font-size:11.5px;margin-left:5px}
.ap-up{color:var(--pos)} .ap-dn{color:var(--warn)} .ap-mute{color:var(--ink-3)}
.ap-tag{
  display:inline-block;font-family:var(--sans);font-size:11.5px;font-weight:500;
  padding:1px 8px;border-radius:99px;border:1px solid var(--line-strong);color:var(--ink-2);
}
.ap-tag.buy{border-color:rgba(var(--pos-soft),.5);color:var(--pos)}
.ap-tag.sell{border-color:rgba(239,116,98,.5);color:var(--warn)}
.ap-tag.trim{border-color:rgba(var(--neg-soft),.5);color:var(--neg)}
.ap-chart{position:relative;padding:14px 14px 6px}
.ap-chart svg{display:block;width:100%;height:auto;overflow:visible}
.ap-chart .grid{stroke:var(--line);stroke-width:1}
.ap-chart .zero{stroke:var(--line-strong);stroke-width:1;stroke-dasharray:3 4}
.ap-chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ap-chart .ar{fill:var(--accent-soft);stroke:none}
.ap-chart .ax{font-family:var(--mono);font-size:10.5px;fill:var(--ink-3)}
.ap-chart .cross{stroke:var(--ink-3);stroke-width:1;visibility:hidden}
.ap-chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2;visibility:hidden}
.ap-tip{
  position:absolute;pointer-events:none;visibility:hidden;z-index:4;white-space:nowrap;
  background:var(--surface-3);border:1px solid var(--line-strong);border-radius:8px;
  padding:6px 10px;font-size:12px;color:var(--ink-2);box-shadow:var(--shadow);
}
.ap-tip b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.ap-todo{padding:14px 18px;font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.ap-todo p{margin:0}
.ap-todo p.sub{padding-left:1.6em;color:var(--ink-3);font-size:12.5px}
.ap-todo b{color:var(--ink);font-weight:700}
.ap-days{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.ap-day{
  appearance:none;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--ink-3);
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:4px 10px;
}
.ap-day:hover{color:var(--ink-2);border-color:var(--line-strong)}
.ap-day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.ap-day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ap-msg{padding:16px 18px;font-size:13.5px;line-height:1.8;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.ap-msg b{color:var(--ink);font-weight:700}
.ap-note{font-size:12px;color:var(--ink-3);margin:8px 2px 0}
.ap-pick{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin:0 0 10px}
.ap-pick .ap-days{margin:0;flex:1 1 300px}
.ap-month{
  appearance:none;font-family:var(--mono);font-size:12px;color:var(--ink);cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:7px;padding:4px 10px;
}
.ap-month:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ap-lock{
  max-width:340px;margin:64px auto 0;padding:26px 24px 22px;text-align:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
}
.ap-lock h2{font-family:var(--serif);font-size:18px;margin:0 0 4px}
.ap-lock p{font-size:12.5px;color:var(--ink-3);margin:0 0 16px}
.ap-lock input{
  width:100%;font:inherit;font-size:16px;color:var(--ink);text-align:center;letter-spacing:.06em;
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:9px 12px;
}
.ap-lock input:focus{outline:2px solid var(--accent);outline-offset:1px}
.ap-lock button{
  width:100%;margin-top:10px;font:inherit;font-weight:700;cursor:pointer;
  background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:9px 12px;
}
.ap-lock button:disabled{opacity:.6;cursor:default}
.ap-lock .err{color:var(--warn);margin:12px 0 0}
@media (max-width:760px){
  table.ap-t thead th, table.ap-t tbody td{padding:7px 9px}
  .ap-todo,.ap-msg{padding:12px 13px}
}

/* 週報：用 iframe 隔離渲染。週報自己的 CSS 也用 .top / .wrap，
   直接注進頁面會跟追蹤板的樣式互相覆蓋。 */
.repcard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;margin-top:2px;
}
#repframe{display:block;width:100%;border:0;min-height:420px;background:var(--surface)}

/* 週報清單：一期一列，左邊期別、中間該期入選個股、右邊日期 */
.replist{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
}
.reprow{
  display:grid;grid-template-columns:minmax(152px,auto) 1fr auto;
  gap:6px 16px;align-items:baseline;width:100%;text-align:left;
  appearance:none;border:0;border-bottom:1px solid var(--line);background:none;
  color:var(--ink);font-family:var(--sans);cursor:pointer;padding:12px 16px;
}
.reprow:last-child{border-bottom:0}
.reprow:hover{background:var(--surface-2)}
.reprow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.reprow .rt{font-size:14px;font-weight:500;white-space:nowrap}
.reprow .rs{display:flex;flex-wrap:wrap;gap:4px 5px;min-width:0}
.reprow .rd{
  font-family:var(--mono);font-size:12px;color:var(--ink-3);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.st{
  font-size:11.5px;color:var(--ink-2);background:var(--surface-3);
  border-radius:5px;padding:1px 7px;white-space:nowrap;
}
.st b{font-family:var(--mono);font-weight:500;color:var(--ink-3);margin-right:4px}
.st.hot{color:var(--neg);background:rgba(var(--neg-soft),.13)}
.st.hot b{color:var(--neg);opacity:.75}
.st.clown{color:var(--ink-3)}
.st mark{background:rgba(137,169,221,.30);color:var(--ink);border-radius:2px;padding:0 1px}
.repcount{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-left:auto}
.backlink{
  appearance:none;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink-2);font-family:var(--sans);font-size:13px;cursor:pointer;
  padding:6px 13px;border-radius:8px;margin-bottom:12px;
}
.backlink:hover{border-color:var(--ink-3);color:var(--ink)}
.backlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:700px){
  /* 窄螢幕改成兩行：第一行期別＋日期，個股整排移到第二行。
     三個子元素在兩欄網格裡若靠自動排版，日期會被擠掉，所以明確指定格位。 */
  .reprow{grid-template-columns:1fr auto}
  .reprow .rt{grid-area:1/1/2/2}
  .reprow .rd{grid-area:1/2/2/3}
  .reprow .rs{grid-area:2/1/3/3}
}
.empty{padding:56px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.empty .big{font-family:var(--serif);font-size:17px;color:var(--ink-2);display:block;margin-bottom:6px}

/* 手機與平板 */
@media (max-width:1160px){
  /* 六個分頁在窄螢幕一定排不下，改成可橫向滑動的一條；
     負邊距讓它從螢幕左緣捲到右緣，不會卡在內距裡。 */
  .tabs{
    overflow-x:auto;overflow-y:hidden;
    margin:0 calc(-1 * var(--pad));padding:0 var(--pad);
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 12px 11px}

  /* 表格自己變成雙向捲動容器，表頭與首欄才有東西可以「黏」——
     沒有高度上限時 sticky 是無效的，因為容器根本不會垂直捲動。 */
  .tscroll{
    overflow:auto;
    max-height:calc(100vh - 24px);
    max-height:calc(100dvh - 24px);
  }
  thead tr:first-child th{top:0}
  thead tr:nth-child(2) th{top:var(--hrow-h,24px)}
  /* 頁面 header 若還是 sticky，會蓋住剛剛釘好的表頭 */
  .top{position:static}
}
@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:last-child{grid-column:1/-1}
  .brand h1{font-size:20px}
  .search{flex:1 1 100%}
  .wrap{padding:0 14px 56px}
  .top-in{--pad:14px;padding:14px var(--pad) 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

        <span class="repcount" id="repcount"></span>
      </div>
      <div class="replist" id="replist"></div>
      <div class="empty" id="repempty" hidden></div>

    <div id="repDoc" hidden>

        <iframe id="repframe" title="選股週報"

</div>

<script>
(function(){
  const ENV  = JSON.parse(document.getElementById('payload').textContent);
  const gate = document.getElementById('gate');
  const app  = document.getElementById('app');
  const form = document.getElementById('lockform');
  const pwin = document.getElementById('pw');
  const btn  = document.getElementById('unlock');
  const errp = document.getElementById('lockerr');
  const STORE = 'littleessay.pw';

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  function fail(msg){
    btn.disabled = false; btn.textContent = '進入';
    errp.textContent = msg; errp.hidden = false;
  }

  let KEY = null;   // 看板與週報共用同一組 salt，所以只導一次

  async function decrypt(pw){
    const km = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(ENV.salt), iterations:ENV.iters, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:b64(ENV.iv)}, key, b64(ENV.ct));
    KEY = key;
    return JSON.parse(new TextDecoder().decode(pt));
  }

  /* 週報各自是一個密文檔，點到才抓才解——全部塞進首頁的話，
     一年三個市場累積下來會變成好幾 MB 的單一檔案。 */
  const repCache = new Map();
  async function fetchReport(file){
    if(repCache.has(file)) return repCache.get(file);
    const res = await fetch('r/' + file, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const env = await res.json();
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(env.iv)}, KEY, b64(env.ct));
    const html = new TextDecoder().decode(pt);
    repCache.set(file, html);
    return html;
  }

  async function tryUnlock(pw, remember){
    btn.disabled = true; btn.textContent = '解鎖中…'; errp.hidden = true;
    try{
      const data = await decrypt(pw);
      if(remember){ try{ localStorage.setItem(STORE, pw); }catch(e){} }
      gate.remove(); app.hidden = false;
      boot(data);
      return true;
    }catch(e){
      try{ localStorage.removeItem(STORE); }catch(_){}
      pwin.value = ''; pwin.focus();
      fail('密碼不對，再試一次');
      return false;
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = pwin.value.trim();
    if(v) tryUnlock(v, true);
  });

  (async function(){
    if(!(window.crypto && crypto.subtle)){
      pwin.disabled = true;
      fail('這個瀏覽器無法解密；請用 https 網址開啟');
      btn.disabled = true;
      return;
    }
    let saved = null;
    try{ saved = localStorage.getItem(STORE); }catch(e){}
    if(saved){
      btn.disabled = true; btn.textContent = '解鎖中…';
      const ok = await tryUnlock(saved, false);
      if(!ok) errp.hidden = true;
    } else {
      pwin.focus();
    }
  })();

  function boot(DATA){
  const SLOPES = [
    {k:'d10',label:'10'},{k:'d21',label:'21'},{k:'d50',label:'50'},{k:'d200',label:'200'},
    {k:'w10',label:'10'},{k:'w30',label:'30'},{k:'w40',label:'40'}
  ];
  const REV = [
    {k:'rev1',label:'最新'},{k:'revc',label:'累計'}
  ];
  const CROSS = [
    {k:'xd10',label:'10'},{k:'xd21',label:'21'},{k:'xd50',label:'50'},{k:'xd200',label:'200'},
    {k:'xw10',label:'10'},{k:'xw30',label:'30'},{k:'xw40',label:'40'}
  ];
  const SEP = {rev1:1,d10:1,w10:1,xd10:1,xw10:1};

  const state = {mode:'board', view:'ma', stages:new Set(), mkt:DATA.order[0], rep:null, repq:'',
                 q:'', theme:null, group:null, pos:false, up:false, dn:false, sort:'group', dir:1};

  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  document.getElementById('gen').textContent = DATA.generated;
  /* header row 2 */
  /* 兩個視圖共用同一張表，只換表頭與表身。個股與族群固定不動。 */
  const MA_HEAD = `
    <tr>
      <th class="sticky lt grp" rowspan="2">個股</th>
      <th class="lt grp" rowspan="2">族群</th>
      <th class="grp sep" colspan="4">日 EMA 斜率 %</th>
      <th class="grp sep" colspan="3">週 SMA 斜率 %</th>
      <th class="grp sep" colspan="4" title="底色越濃＝越近期才穿越；外框＝0~1 個交易日內剛變化。以交易日計，休市日不會讓它退色">近10日穿越 · 日EMA</th>
      <th class="grp sep" colspan="3" title="底色越濃＝越近期才穿越；外框＝0~1 個交易日內剛變化。以交易日計，休市日不會讓它退色">近10日穿越 · 週SMA</th>
      <th class="grp sep" colspan="2">營收 YoY %</th>
      <th class="sep" rowspan="2" data-sort="w52">距52W高<span class="ar">▼</span></th>
      <th class="sep" rowspan="2" data-sort="days">剩餘<span class="ar">▼</span></th>
    </tr>
    <tr id="hrow"></tr>`;

  const STAGE_HEAD = `
    <tr>
      <th class="sticky lt grp" rowspan="2">個股</th>
      <th class="lt grp" rowspan="2">族群</th>
      <th class="sep" rowspan="2" data-sort="st" title="Weinstein 四階段：1 打底、2 上升、3 做頭、4 下跌">Stage<span class="ar">▼</span></th>
      <th rowspan="2" data-sort="stw" title="目前這個 Stage 已經持續幾週">連續週<span class="ar">▼</span></th>
      <th class="grp sep" colspan="4" title="現價距離該條線幾 %；正＝已在線上方">距突破線 %</th>
      <th class="grp sep" colspan="4">線值</th>
      <th class="grp sep" colspan="2" title="前一段波段是否曾觸發">前波</th>
      <th class="grp sep" colspan="2">週SMA</th>
    </tr>
    <tr id="hrow"></tr>`;

  const STAGE_SUBS = [
    {k:'s1p', label:'S1', cls:'sep'}, {k:'s3p', label:'S3'}, {k:'s3hp', label:'S3高'}, {k:'s2p', label:'S2高'},
    {k:'s1v', label:'S1', cls:'sep'}, {k:'s3v', label:'S3'}, {k:'s3hv', label:'S3高'}, {k:'s2v', label:'S2高'},
    {k:'pw1', label:'S1', cls:'sep'}, {k:'pw3', label:'S3'},
    {k:'ws10', label:'10', cls:'sep'}, {k:'ws30', label:'30'}
  ];

  const hcell = (o, cls) =>
    `<th class="${cls}${SEP[o.k]?' sep':''}" data-sort="${o.k}">${o.label}<span class="ar">▼</span></th>`;
  function renderHead(){
    $('#thead').innerHTML = state.view === 'stage' ? STAGE_HEAD : MA_HEAD;
    $('#hrow').innerHTML = state.view === 'stage'
      ? STAGE_SUBS.map(o => hcell(o, o.cls || '')).join('')
      : SLOPES.map(o=>hcell(o,'')).join('')
        + CROSS.map(o=>hcell(o,'xc')).join('')
        + REV.map(o=>hcell(o,'')).join('');
    /* 表頭是重建的，排序監聽要跟著重綁 */
    document.querySelectorAll('#thead th[data-sort]').forEach(th => {
      if(th.dataset.sort === state.sort){
        th.setAttribute('data-dir', state.dir);
        const a = th.querySelector('.ar');
        if(a) a.textContent = state.dir < 0 ? '▼' : '▲';
      }
      th.addEventListener('click', () => {
        const k = th.dataset.sort;
        state.dir = (state.sort === k) ? -state.dir : -1;
        state.sort = k;
        renderHead(); render();
      });
    });
  }

  const REPORTS = DATA.reports || [];
  const repMarkets = DATA.order.filter(m => REPORTS.some(r => r.market === m));

  const AP = DATA.autopilot && DATA.autopilot.markets && DATA.autopilot.markets.length ? DATA.autopilot : null;
  const apMarkets = AP ? AP.markets.map(m => m.key) : [];

  function renderTabs(){
    const list = state.mode === 'board' ? DATA.order : state.mode === 'auto' ? apMarkets : repMarkets;
    $('#tabs').innerHTML = list.map(m => {
      const n = state.mode === 'board'
        ? DATA.markets[m].rows.length
        : state.mode === 'auto'
        ? AP.markets.find(x => x.key === m).days
        : REPORTS.filter(r => r.market === m).length;
      return `<button class="tab" role="tab" data-m="${m}" aria-selected="${m===state.mkt}"
        >${DATA.markets[m].label}<span class="n">${n}</span></button>`;
    }).join('');
  }

  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if(!b) return;
    state.mkt = b.dataset.m;
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.m===state.mkt));
    if(state.mode === 'board'){
      state.theme = null; state.group = null; state.sort='group'; state.dir=1;
      syncViewAvail();
      renderHead(); renderToggles(); render(); renderTrail();
    } else if(state.mode === 'auto'){
      state.apDay = null; state.apMonth = null; showAutopilot();
    } else {
      state.rep = null; showReports();
    }
    syncOffsets();
  });

  /* ---------- 模式切換 ---------- */
  if(REPORTS.length || AP) $('#modes').hidden = false;
  if(AP) $('#modeAuto').hidden = false;

  $('#modes').addEventListener('click', e => {
    const b = e.target.closest('.mode'); if(!b) return;
    setMode(b.dataset.mode);
  });

  function setMode(mode){
    if(mode === 'report' && !REPORTS.length) return;
    if(mode === 'auto' && !AP) return;
    state.mode = mode;
    document.querySelectorAll('.mode').forEach(m =>
      m.setAttribute('aria-selected', m.dataset.mode === mode));
    $('#boardView').hidden  = mode !== 'board';
    $('#reportView').hidden = mode !== 'report';
    $('#autoView').hidden   = mode !== 'auto';
    if(mode === 'auto'){
      if(!apMarkets.includes(state.mkt)) state.mkt = apMarkets[0];
      state.apDay = null;
      renderTabs(); showAutopilot(); stopTrail();
    } else if(mode === 'report'){
      if(!repMarkets.includes(state.mkt)) state.mkt = repMarkets[0];
      renderTabs(); showReports(); stopTrail();
    } else {
      renderTabs(); render(); renderTrail();
    }
    syncOffsets();
  }

  /* ---------- 自導自演 ---------- */
  /* 紙上帳戶每天一筆存檔（autopilot_log.py 拆 TG 訊息存的）。整份是一個密文檔，點到這個分頁才抓才解。 */
  /* 這個分頁有自己的密碼：自己的 salt、自己的金鑰（AP_KEY），跟網站那把無關。
     解得開 ap/data.json 就是密碼對了（AES-GCM 解錯會直接丟例外）。 */
  const AP_STORE = 'littleessay.appw';
  let AP_KEY = null;
  const apFiles = new Map();           // 檔名 → Promise<內容>；每個月的訊息各自一個檔，看到才抓
  async function apDeriveKey(pw){
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(AP.salt), iterations:AP.iters, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  }
  async function apOpen(file, key){
    const res = await fetch('ap/' + file, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const env = await res.json();
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(env.iv)}, key, b64(env.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function apFile(file){
    if(!apFiles.has(file)){
      apFiles.set(file, apOpen(file, AP_KEY).catch(e => { apFiles.delete(file); throw e; }));
    }
    return apFiles.get(file);
  }
  const fetchAutopilot = () => apFile(AP.file);
  /* 回傳 true＝解開了；false＝密碼不對；丟例外＝檔案抓不到（不是密碼的問題，別把存著的密碼清掉） */
  async function apUnlock(pw, remember){
    const key = await apDeriveKey(pw);
    let res;
    try{ res = await fetch('ap/' + AP.file, {cache:'no-cache'}); }catch(e){ throw new Error('連不上'); }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const env = await res.json();
    let doc;
    try{
      const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(env.iv)}, key, b64(env.ct));
      doc = JSON.parse(new TextDecoder().decode(pt));
    }catch(e){
      try{ localStorage.removeItem(AP_STORE); }catch(_){}
      return false;
    }
    AP_KEY = key;
    apFiles.set(AP.file, Promise.resolve(doc));
    if(remember){ try{ localStorage.setItem(AP_STORE, pw); }catch(e){} }
    return true;
  }
  $('#apLock').addEventListener('submit', async e => {
    e.preventDefault();
    const inp = $('#apPw'), btn2 = $('#apUnlock'), err = $('#apLockErr');
    const v = inp.value.trim(); if(!v) return;
    btn2.disabled = true; btn2.textContent = '解鎖中…'; err.hidden = true;
    let ok = false, msg = '密碼不對，再試一次';
    try{ ok = await apUnlock(v, true); }catch(ex){ msg = '資料讀不到（' + (ex.message || ex) + '），晚點再試'; }
    btn2.disabled = false; btn2.textContent = '解鎖';
    if(ok){ inp.value = ''; showAutopilot(); }
    else { err.textContent = msg; err.hidden = false; inp.value = ''; inp.focus(); }
  });

  const apNum = (v, d) => v == null ? '—' : Number(v).toLocaleString('en-US', {minimumFractionDigits:d||0, maximumFractionDigits:d==null?2:d});
  const apSign = (v, d) => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + apNum(Math.abs(v), d);
  const apCls = v => v == null || v === 0 ? 'ap-mute' : v > 0 ? 'ap-up' : 'ap-dn';
  const apMD = d => d ? (+d.slice(5,7)) + '/' + (+d.slice(8,10)) : '';
  /* 訊息是 TG 的 HTML：只有 <b> 一種標籤，其餘字元已經跳脫過。先還原、整段重新跳脫，再只放行粗體。 */
  function apRich(line){
    const raw = line.replace(/<b>/g, '\u0001').replace(/<\/b>/g, '\u0002')
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
    return esc(raw).replace(/\u0001/g, '<b>').replace(/\u0002/g, '</b>');
  }

  async function showAutopilot(){
    const body = $('#apBody'), empty = $('#apEmpty'), lock = $('#apLock');
    let all;
    if(!AP_KEY){
      body.hidden = true; empty.hidden = true;
      let saved = null;
      try{ saved = localStorage.getItem(AP_STORE); }catch(e){}
      let ok = false;
      if(saved){
        empty.hidden = false; empty.textContent = '解鎖中…';
        try{ ok = await apUnlock(saved, false); }catch(e){}
        empty.hidden = true;
      }
      if(!ok){
        if(state.mode === 'auto'){ lock.hidden = false; $('#apPw').focus(); }
        return;
      }
    }
    lock.hidden = true;
    try{
      if(!apFiles.has(AP.file)){ body.hidden = true; empty.hidden = false; empty.textContent = '讀取中…'; }
      all = await fetchAutopilot();
    }catch(e){
      body.hidden = true; empty.hidden = false;
      empty.innerHTML = '<span class="big">自導自演的資料讀不到</span>' + esc(e.message || e);
      return;
    }
    if(state.mode !== 'auto') return;
    const mk = all[state.mkt];
    if(!mk || !Object.keys(mk.days || {}).length){
      body.hidden = true; empty.hidden = false;
      empty.innerHTML = '<span class="big">這個市場還沒有紀錄</span>';
      return;
    }
    empty.hidden = true; body.hidden = false;
    const cur = state.mkt === 'US' ? '美元' : '元';
    const dates = Object.keys(mk.days).sort();
    const last = mk.days[dates[dates.length - 1]];
    const prev = dates.length > 1 ? mk.days[dates[dates.length - 2]] : null;
    const events = mk.events || [];
    const sells = events.filter(e => e.kind !== '買進');
    const wins = sells.filter(e => e.pnl > 0).length;

    /* --- 頂上五格 --- */
    const dayChg = prev ? last.equity - prev.equity : null;
    $('#apStats').innerHTML = [
      ['總值', apNum(last.equity, 0), cur + '（' + apSign(last.ret, 2) + '%）', apCls(last.ret)],
      ['比前一天', apSign(dayChg, 0), cur, apCls(dayChg)],
      ['現金', apNum(last.cash, 0), last.equity ? Math.round(last.cash / last.equity * 100) + '%' : '', ''],
      ['已實現／未實現', apSign(last.realized, 0) + ' ／ ' + apSign(last.unreal, 0), cur, ''],
      ['盤勢', esc(last.regime || '—'), last.slots != null ? '持有 ' + last.positions.length + '／最多 ' + last.slots + ' 檔' : '', ''],
    ].map(x => `<div class="stat"><span class="k">${x[0]}</span><span class="v ${x[3]}">${x[1]}<small>${x[2]}</small></span></div>`).join('');

    /* --- 資金曲線：一條線（報酬率 %），所以不用圖例；滑過去看每一天 --- */
    $('#apChartSub').textContent = apMD(dates[0]) + ' 起，' + dates.length + ' 個交易日　·　資料至 ' + apMD(last.date) + ' 收盤';
    apChart(dates.map(d => mk.days[d]), cur);

    /* --- 持股 --- */
    $('#apPosSub').textContent = last.positions.length ? last.positions.length + ' 檔，' + apMD(last.date) + ' 收盤' : '';
    $('#apPos').innerHTML = last.positions.length ? `<thead><tr>
        <th class="lt">股票</th><th>股數</th><th>均價</th><th>現價</th><th>損益</th><th>停損價</th><th>停利價</th><th>市值</th>
      </tr></thead><tbody>` + last.positions.map(p => `<tr>
        <td class="lt nm">${esc(p.name)}<small>${esc(p.code)}</small></td>
        <td>${apNum(p.shares, 0)}</td><td>${apNum(p.avg)}</td><td>${apNum(p.now)}</td>
        <td class="${apCls(p.pnl)}">${apSign(p.pnl, 0)}<small>${apSign(p.pct, 1)}%</small></td>
        <td>${apNum(p.stop)}<small>${p.stop && p.now ? apSign((p.stop / p.now - 1) * 100, 1) + '%' : ''}</small></td>
        <td>${p.tp ? apNum(p.tp) + '<small>' + apSign((p.tp / p.now - 1) * 100, 1) + '%</small>' : '<span class="ap-mute">—</span>'}</td>
        <td>${apNum(p.mv, 0)}</td></tr>`).join('') + '</tbody>'
      : '<tbody><tr><td class="lt ap-mute" style="font-family:var(--sans)">目前空手</td></tr></tbody>';

    /* --- 接下來要做的事：最新那則訊息的第一段 --- */
    const stamp = state.mkt;                      // 等訊息檔的時候使用者可能已經切到別的市場
    const msgOf = async d => {
      try{ return ((await apFile(d.slice(0, 7) + '.json'))[stamp] || {})[d] || ''; }catch(e){ return null; }
    };
    const lastMsg = await msgOf(last.date);
    if(state.mode !== 'auto' || state.mkt !== stamp) return;
    const lines = (lastMsg || '').split('\n');
    const a = lines.findIndex(l => /【.*要做的事】/.test(l));
    let todo = [];
    if(a >= 0){
      for(let i = a + 1; i < lines.length && !/^<b>【/.test(lines[i]); i++) if(lines[i].trim()) todo.push(lines[i]);
    }
    $('#apTodoHead').innerHTML = (a >= 0 ? apRich(lines[a]).replace(/<\/?b>|[【】]/g, '') : '接下來要做的事')
      + ' <small>' + apMD(last.date) + ' 收盤後決定的</small>';
    $('#apTodo').innerHTML = todo.length
      ? todo.map(l => `<p class="${/^\s{2,}/.test(l) ? 'sub' : ''}">${apRich(l.trim())}</p>`).join('')
      : '<p class="ap-mute">沒有要做的事。</p>';

    /* --- 交易紀錄：新的在上 --- */
    $('#apEvSub').textContent = events.length
      ? '買 ' + (events.length - sells.length) + ' 筆、賣 ' + sells.length + ' 筆' + (sells.length ? '（賺 ' + wins + '、賠 ' + (sells.length - wins) + '）' : '')
      : '';
    const tag = k => k === '買進' ? 'buy' : (k === '停利' || k === '減碼') ? 'trim' : 'sell';
    $('#apEv').innerHTML = events.length ? `<thead><tr>
        <th class="lt">日期</th><th class="lt">動作</th><th class="lt">股票</th><th>價格</th><th>股數</th><th>金額</th><th>損益</th><th class="lt">原因</th>
      </tr></thead><tbody>` + events.slice().reverse().map(e => `<tr>
        <td class="lt">${esc(e.date)}</td>
        <td class="lt"><span class="ap-tag ${tag(e.kind)}">${esc(e.kind)}</span>${e.src ? '<small>補</small>' : ''}</td>
        <td class="lt nm">${esc(e.name)}<small>${esc(e.code)}</small></td>
        <td>${apNum(e.price)}</td><td>${apNum(e.shares, 0)}</td>
        <td>${e.price != null && e.shares != null ? apNum(e.price * e.shares, 0) : '—'}</td>
        <td class="${apCls(e.pnl)}">${e.pnl == null ? '<span class="ap-mute">—</span>' : apSign(e.pnl, 0) + (e.r != null ? '<small>' + apSign(e.r, 1) + ' 倍風險</small>' : '')}</td>
        <td class="why">${e.kind === '買進' ? (e.stop != null ? '停損設 ' + apNum(e.stop) : '') : esc(e.why || '')}</td></tr>`).join('') + '</tbody>'
      : '<tbody><tr><td class="lt ap-mute" style="font-family:var(--sans)">還沒有成交</td></tr></tbody>';
    $('#apEvNote').hidden = !events.some(e => e.src);

    /* --- 每日紀錄 --- */
    /* 一次只列一個月的日期，訊息也是一個月一個檔——紀錄再多年，畫面和下載量都只有一個月的份 */
    const months = Array.from(new Set(dates.map(d => d.slice(0, 7)))).filter(m => (AP.months || []).includes(m)).reverse();
    if(!state.apMonth || !months.includes(state.apMonth)) state.apMonth = months[0];
    $('#apMonth').innerHTML = months.map(m =>
      `<option value="${m}"${m === state.apMonth ? ' selected' : ''}>${m.slice(0, 4)} 年 ${+m.slice(5)} 月</option>`).join('');
    $('#apMonth').hidden = months.length < 2;
    await apDayLog(stamp, dates);
  }

  async function apDayLog(market, dates){
    if(!state.apMonth){ $('#apDays').innerHTML = ''; $('#apMsg').innerHTML = '<span class="ap-mute">沒有紀錄</span>'; return; }
    let doc = null;
    try{ doc = (await apFile(state.apMonth + '.json'))[market] || {}; }catch(e){}
    if(state.mode !== 'auto' || state.mkt !== market) return;
    if(!doc){ $('#apDays').innerHTML = ''; $('#apMsg').innerHTML = '<span class="ap-mute">這個月的紀錄讀不到</span>'; return; }
    const days = Object.keys(doc).sort().reverse();
    if(!state.apDay || !days.includes(state.apDay)) state.apDay = days[0];
    $('#apDays').innerHTML = days.map(d =>
      `<button class="ap-day" data-d="${d}" aria-pressed="${d === state.apDay}">${apMD(d)}</button>`).join('');
    $('#apMsg').innerHTML = state.apDay
      ? doc[state.apDay].split('\n').map(apRich).join('\n')
      : '<span class="ap-mute">這個月沒有紀錄</span>';
  }

  $('#apDays').addEventListener('click', e => {
    const b = e.target.closest('.ap-day'); if(!b) return;
    state.apDay = b.dataset.d; apDayLog(state.mkt);
  });
  $('#apMonth').addEventListener('change', e => {
    state.apMonth = e.target.value; state.apDay = null; apDayLog(state.mkt);
  });

  function apChart(days, cur){
    const box = $('#apChart');
    if(days.length < 2){ box.innerHTML = '<p class="ap-note">只有一天的資料，還畫不出曲線</p>'; return; }
    const W = 1000, H = 250, L = 46, R = 14, T = 12, B = 24;
    const ys = days.map(d => d.ret || 0);
    let lo = Math.min(0, ...ys), hi = Math.max(0, ...ys);
    const pad = Math.max((hi - lo) * 0.12, 0.2); lo -= pad; hi += pad;
    const x = i => L + (W - L - R) * i / (days.length - 1);
    const y = v => T + (H - T - B) * (hi - v) / (hi - lo);
    const step = [0.25, 0.5, 1, 2, 5, 10, 20, 50].find(s => (hi - lo) / s <= 5) || 100;
    let grid = '';
    for(let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step){
      const z = Math.abs(v) < 1e-9;
      grid += `<line class="${z ? 'zero' : 'grid'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`
            + `<text class="ax" x="${L - 7}" y="${y(v) + 3.5}" text-anchor="end">${(v > 0 ? '+' : '') + (+v.toFixed(2))}%</text>`;
    }
    const every = Math.ceil(days.length / 8);
    let xl = '';
    days.forEach((d, i) => { if(i % every === 0 || i === days.length - 1)
      xl += `<text class="ax" x="${x(i)}" y="${H - 6}" text-anchor="${i === days.length - 1 ? 'end' : i === 0 ? 'start' : 'middle'}">${apMD(d.date)}</text>`; });
    const pts = days.map((d, i) => x(i).toFixed(1) + ',' + y(d.ret || 0).toFixed(1));
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="紙上帳戶累積報酬率，${apMD(days[0].date)} 至 ${apMD(days[days.length-1].date)}">
        ${grid}${xl}
        <polygon class="ar" points="${x(0)},${y(0)} ${pts.join(' ')} ${x(days.length - 1)},${y(0)}"/>
        <polyline class="ln" points="${pts.join(' ')}"/>
        <line class="cross" y1="${T}" y2="${H - B}"/><circle class="dot" r="4.5"/>
        <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
      </svg><div class="ap-tip"></div>`;
    const svg = box.querySelector('svg'), cross = box.querySelector('.cross'),
          dot = box.querySelector('.dot'), tip = box.querySelector('.ap-tip');
    const show = ev => {
      const r = svg.getBoundingClientRect();
      const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * W;
      const i = Math.max(0, Math.min(days.length - 1, Math.round((px - L) / (W - L - R) * (days.length - 1))));
      const d = days[i], cx = x(i), cy = y(d.ret || 0);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx);
      dot.setAttribute('cx', cx); dot.setAttribute('cy', cy);
      cross.style.visibility = dot.style.visibility = tip.style.visibility = 'visible';
      tip.innerHTML = esc(d.date) + '　<b>' + apSign(d.ret, 2) + '%</b>　總值 <b>' + apNum(d.equity, 0) + '</b> ' + cur
        + (d.positions && d.positions.length ? '　持股 ' + d.positions.length + ' 檔' : '　空手');
      const br = box.getBoundingClientRect(), tw = tip.offsetWidth;
      let left = r.left - br.left + cx / W * r.width + 12;
      if(left + tw > br.width - 6) left = r.left - br.left + cx / W * r.width - tw - 12;
      tip.style.left = Math.max(6, left) + 'px';
      tip.style.top = Math.max(6, r.top - br.top + cy / H * r.height - 38) + 'px';
    };
    const hide = () => { cross.style.visibility = dot.style.visibility = tip.style.visibility = 'hidden'; };
    svg.addEventListener('mousemove', show); svg.addEventListener('mouseleave', hide);
    svg.addEventListener('touchstart', show, {passive:true}); svg.addEventListener('touchmove', show, {passive:true});
  }

  /* ---------- 週報 ---------- */
  /* 清單是入口：一期一列，右邊直接列出該期入選的個股，不用點進去才看得到。
     搜尋有查詢字時跨所有市場找，因為「哪一週提過這檔」比「這個市場有哪些期」有用。 */
  $('#repq').addEventListener('input', e => { state.repq = e.target.value.trim().toLowerCase(); showReports(); });
  $('#repback').addEventListener('click', () => { state.rep = null; showReports(); });

  function hit(r, q){
    if(!q) return true;
    if(((r.listTitle||'') + ' ' + r.title + ' ' + r.date + ' ' + r.label).toLowerCase().includes(q)) return true;
    return r.stocks.some(t => (t.code + ' ' + t.name).toLowerCase().includes(q));
  }

  function mark(text, q){
    const t = esc(text);
    if(!q) return t;
    const i = text.toLowerCase().indexOf(q);
    if(i < 0) return t;
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length))
         + '</mark>' + esc(text.slice(i + q.length));
  }

  function showReports(){
    const q = state.repq || '';
    /* 有查詢字就跨市場找，沒有就只看目前分頁 */
    const list = REPORTS.filter(r => (q ? true : r.market === state.mkt) && hit(r, q));

    $('#repList').hidden = !!state.rep;
    $('#repDoc').hidden  = !state.rep;
    if(state.rep){ openReport(state.rep); return; }

    $('#repcount').textContent = q
      ? list.length + ' / ' + REPORTS.length + ' 期（全市場）'
      : list.length + ' 期';

    const box = $('#replist'), empty = $('#repempty');
    if(!list.length){
      box.innerHTML = ''; box.hidden = true; empty.hidden = false;
      empty.innerHTML = q
        ? '<span class="big">沒有符合的週報</span>試試代號、公司名或日期'
        : '<span class="big">' + DATA.markets[state.mkt].label + ' 還沒有週報</span>'
          + '把 &lt;市場&gt;-&lt;日期&gt;.html 放進 weekly_reports 資料夾，下次同步就會出現';
      return;
    }
    box.hidden = false; empty.hidden = true;
    box.innerHTML = list.map(r => {
      const stocks = r.stocks.map(t =>
        `<span class="st${t.tag ? ' ' + t.tag : ''}"${t.tag === 'hot' ? ' title="過熱區"' : t.tag === 'clown' ? ' title="基本面存疑"' : ''}
          ><b>${mark(t.code, q)}</b>${mark(t.name, q)}</span>`).join('');
      return `<button class="reprow" data-f="${r.file}">
        <span class="rt">${mark(r.listTitle || r.title, q)}</span>
        <span class="rs">${stocks}</span>
        <span class="rd">${r.stocks.length} 檔</span>
      </button>`;
    }).join('');
  }

  $('#replist').addEventListener('click', e => {
    const b = e.target.closest('.reprow'); if(!b) return;
    state.rep = b.dataset.f;
    showReports();
    window.scrollTo(0, 0);
  });

  async function openReport(file){
    const meta = REPORTS.find(r => r.file === file);
    const card = $('#repcard');
    if(!meta){ state.rep = null; showReports(); return; }
    try{
      const html = await fetchReport(file);
      const f = $('#repframe');
      f.onload = () => {
        sizeFrame();
        if(pendingCode){ const c = pendingCode; pendingCode = null; scrollToCard(c); }
      };
      f.srcdoc = html;
      card.hidden = false;
    }catch(err){
      card.hidden = true;
      $('#repDoc').insertAdjacentHTML('beforeend',
        '<div class="empty"><span class="big">這份週報讀不到</span>'
        + esc(String(err && err.message || err)) + '</div>');
    }
  }

  /* srcdoc 的高度外面量不到，載完後照內容撐開，才不會出現兩層捲軸 */
  function sizeFrame(){
    const f = $('#repframe');
    try{
      const d = f.contentDocument;
      if(d && d.documentElement) f.style.height = (d.documentElement.scrollHeight + 8) + 'px';
    }catch(e){}
  }
  window.addEventListener('resize', sizeFrame);

  /* ---------- 週報跑馬燈 ---------- */
  /* 「這檔上週報說了什麼」原本要先想起是哪一期、再點進去翻，
     所以這條橫帶反過來以個股為入口：直接跳到它最近那期裡自己的那張卡。 */
  let pendingCode = null;

  function trailStocks(market){
    const reps = REPORTS.filter(r => r.market === market)
      .slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    const seen = new Map();
    for(const r of reps){
      for(const t of r.stocks){
        const cur = seen.get(t.code);
        if(cur){ cur.n++; continue; }         /* 先遇到的就是最近那期 */
        seen.set(t.code, {code:t.code, name:t.name, tag:t.tag,
                          file:r.file, date:r.date, n:1});
      }
    }
    return [...seen.values()];
  }

  /* BTFD 那三個分頁沒有週報可以對應，帶子就換一套排法：
     照 Pine 的 Stage 1→4 跑（打底的排前面），點下去落在表格自己那一列。
     日股連 Pine MASTER 都沒有、沒有 Stage，退回 120 天倒數、快到期的先跑。 */
  function trailItems(market){
    if(REPORTS.some(r => r.market === market)){
      return {kind:'report', label:'週報提過', items:trailStocks(market)};
    }
    const rows = DATA.markets[market].rows;
    const byDays = (a, b) => (a.days == null ? 1e9 : a.days) - (b.days == null ? 1e9 : b.days)
                          || String(a.code).localeCompare(String(b.code));
    const staged = rows.filter(r => r.st != null);
    if(staged.length){
      return {kind:'stage', label:'Stage 1→4',
              items:staged.slice().sort((a, b) => a.st - b.st || byDays(a, b))};
    }
    return {kind:'days', label:'倒數天數', items:rows.slice().sort(byDays)};
  }

  function trailChip(kind, t){
    if(kind === 'report'){
      return `<button class="tk${t.tag ? ' ' + t.tag : ''}" data-code="${esc(t.code)}" data-file="${esc(t.file)}"
        title="${esc(t.name)}｜最近出現在 ${esc(t.date)} 這期${t.n > 1 ? '（共 ' + t.n + ' 期）' : ''}"
        ><b>${esc(t.code)}</b>${esc(t.name)}${t.n > 1 ? `<span class="n">${t.n}</span>` : ''}</button>`;
    }
    if(kind === 'stage'){
      return `<button class="tk s${t.st}" data-code="${esc(t.code)}"
        title="Stage ${t.st} ${STAGE_NAME[t.st]}${t.stw == null ? '' : '｜連續 ' + t.stw + ' 週'}${t.days == null ? '' : '｜剩 ' + t.days + ' 天'}"
        ><b>${esc(t.code)}</b>${esc(t.name)}<span class="sg">${t.st}</span></button>`;
    }
    return `<button class="tk" data-code="${esc(t.code)}"
      title="${esc(t.name)}｜剩 ${t.days == null ? '—' : t.days} 天"
      ><b>${esc(t.code)}</b>${esc(t.name)}<span class="n">${t.days == null ? '—' : t.days + '天'}</span></button>`;
  }

  function renderTrail(){
    const trail = $('#trail');
    const pack = state.mode === 'board' ? trailItems(state.mkt)
                                        : {kind:'', label:'', items:[]};
    if(!pack.items.length){ trail.hidden = true; stopTrail(); return; }
    trail.hidden = false;
    $('#traillabel').textContent = pack.label;
    const html = pack.items.map(t => trailChip(pack.kind, t)).join('');
    $('#trailtrack').innerHTML = html + html;   /* 要接得起來，同一份鋪兩遍 */
    releaseTrail();          /* 上一輪可能停在「按住」沒放掉，換分頁就當它放開了 */
    trailPos = 0;
    $('#trailclip').scrollLeft = 0;
    startTrail();
  }

  /* 用 scrollLeft 走而不是 CSS transform：這樣滾輪與觸控可以直接撥，
     停下來時位置也還在，不會跟動畫打架。 */
  let trailRaf = null, trailPos = 0, trailHold = false, trailLast = 0;
  const TRAIL_SPEED = 0.042;                   /* px/ms ≈ 42px/s */
  const trailStill = window.matchMedia('(prefers-reduced-motion: reduce)');

  function startTrail(){
    stopTrail();
    if(trailStill.matches) return;
    trailLast = 0;
    trailRaf = requestAnimationFrame(stepTrail);
  }
  function stopTrail(){
    if(trailRaf){ cancelAnimationFrame(trailRaf); trailRaf = null; }
  }
  function stepTrail(ts){
    const clip = $('#trailclip');
    const half = clip.scrollWidth / 2;
    if(!trailHold && half > 0){
      const dt = trailLast ? Math.min(ts - trailLast, 64) : 0;   /* 切回分頁不要暴衝 */
      trailPos += dt * TRAIL_SPEED;
      if(trailPos >= half) trailPos -= half;
      clip.scrollLeft = trailPos;
    }
    trailLast = ts;
    trailRaf = requestAnimationFrame(stepTrail);
  }

  let trailIdle = null;
  function holdTrail(){ trailHold = true; clearTimeout(trailIdle); }
  function releaseTrail(){
    clearTimeout(trailIdle);
    trailHold = false;
    trailPos = $('#trailclip').scrollLeft;       /* 接手使用者撥到的位置 */
  }
  /* 手指放開之後還有慣性在跑，這時候把 scrollLeft 搶回來會把那一撥卡死，
     所以等它自己停穩了再接手 */
  function releaseWhenSettled(){
    clearTimeout(trailIdle);
    trailIdle = setTimeout(releaseTrail, 900);
  }
  $('#trail').addEventListener('pointerenter', e => {
    if(e.pointerType === 'mouse') holdTrail();
  });
  $('#trail').addEventListener('pointerleave', e => {
    if(e.pointerType === 'mouse') releaseTrail();
  });
  /* 觸控沒有「移開」：按著就停，放開等滑完再走 */
  $('#trail').addEventListener('pointerdown', holdTrail);
  ['pointerup', 'pointercancel'].forEach(ev =>
    $('#trail').addEventListener(ev, e => {
      if(e.pointerType !== 'mouse') releaseWhenSettled();
    }));
  $('#trailclip').addEventListener('scroll', () => {
    if(trailHold && trailIdle) releaseWhenSettled();   /* 還在滑就再等一下 */
  });
  $('#trail').addEventListener('focusin', holdTrail);
  /* 在帶子裡用鍵盤跳到下一顆時 focusout 也會觸發，別一閃就跑掉 */
  $('#trail').addEventListener('focusout', e => {
    if(!$('#trail').contains(e.relatedTarget)) releaseTrail();
  });
  if(trailStill.addEventListener){                /* 舊 Safari 沒有這個介面 */
    trailStill.addEventListener('change', () => {
      if(trailStill.matches) stopTrail(); else if(!$('#trail').hidden) startTrail();
    });
  }

  $('#trailtrack').addEventListener('click', e => {
    const b = e.target.closest('.tk'); if(!b) return;
    if(b.dataset.file) openStock(b.dataset.file, b.dataset.code);
    else revealRow(b.dataset.code);
  });

  /* 沒有週報可以跳的市場：落在表格裡那一列 */
  function revealRow(code){
    const find = () => [...$('#tbody').querySelectorAll('tr')]
      .find(x => x.dataset.code === code);
    let tr = find();
    if(!tr){                    /* 篩選開著時那一列根本沒被畫出來，先把條件放掉 */
      state.q = ''; $('#q').value = '';
      state.theme = null; state.group = null;
      state.pos = state.up = state.dn = false;
      ['#tPos', '#tUp', '#tDn'].forEach(s => $(s).setAttribute('aria-pressed', 'false'));
      state.stages = new Set();
      renderToggles(); render();
      tr = find();
    }
    if(!tr) return;
    tr.classList.add('flash');
    setTimeout(() => tr.classList.remove('flash'), 2400);
    tr.scrollIntoView({block:'center'});
  }

  function openStock(file, code){
    const meta = REPORTS.find(r => r.file === file);
    if(!meta) return;
    state.mkt = meta.market;
    state.rep = file;
    state.repq = '';
    $('#repq').value = '';
    pendingCode = code;
    setMode('report');
    window.scrollTo(0, 0);
  }

  /* 週報是 srcdoc iframe、而且高度被撐到滿，所以捲的是外層頁面不是 iframe */
  function scrollToCard(code){
    const f = $('#repframe');
    let card = null;
    try{
      const d = f.contentDocument;
      card = [...d.querySelectorAll('.card')].find(c => {
        const el = c.querySelector('.code');
        return el && el.textContent.trim() === code;
      });
    }catch(e){}
    if(card){
      card.style.outline = '2px solid rgba(137,169,221,.75)';
      card.style.outlineOffset = '4px';
      setTimeout(() => { card.style.outline = ''; card.style.outlineOffset = ''; }, 2400);
    }
    /* 表頭在窄螢幕會改回 static（讓表格自己的凍結列釘得住），
       那時候不必替它讓位，否則會停在上一張卡的尾巴 */
    const topEl = document.querySelector('.top');
    const head = topEl && getComputedStyle(topEl).position === 'sticky'
      ? topEl.offsetHeight : 0;
    const top = f.getBoundingClientRect().top + window.scrollY
              + (card ? card.getBoundingClientRect().top : 0) - head - 14;
    /* 週報動輒上萬 px，smooth 會變成一秒多的模糊捲動；
       模式本來就整個換掉了，沒有連續性要保，直接落點反而清楚 */
    window.scrollTo(0, Math.max(top, 0));
  }

  /* controls */
  $('#q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
  [['#tPos','pos'],['#tUp','up'],['#tDn','dn']].forEach(([sel,key]) => {
    $(sel).addEventListener('click', e => {
      state[key] = !state[key];
      e.currentTarget.setAttribute('aria-pressed', state[key]);
      render();
    });
  });
  /* ---------- 視圖切換 ---------- */
  $('#views').addEventListener('click', e => {
    const b = e.target.closest('.vbtn'); if(!b) return;
    setView(b.dataset.v);
  });

  function setView(v){
    if(v === state.view) return;
    state.view = v;
    state.pos = state.up = state.dn = false;        // 兩邊的快篩條件不共用
    state.stages = new Set();
    state.sort = 'group'; state.dir = 1;
    document.querySelectorAll('.vbtn').forEach(x =>
      x.setAttribute('aria-selected', x.dataset.v === v));
    renderHead(); renderToggles(); render(); syncOffsets();
  }

  const fmtPct = v => v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(1);
  const fmtVal = v => v == null ? '—' : (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1));

  /* 距突破線 %：正＝已在線上方。級距很大（可到 +3000%），底色 30% 封頂 */
  function brkTint(v){
    if(v == null) return '';
    const a = Math.min(Math.abs(v)/30, 1) * 0.16;
    if(v > 0) return `color:var(--pos);background:rgba(var(--pos-soft),${a.toFixed(3)})`;
    if(v < 0) return `color:var(--neg);background:rgba(var(--neg-soft),${a.toFixed(3)})`;
    return 'color:var(--flat)';
  }

  const flagCell = v => v === 1
    ? '<span class="flag">✓</span>'
    : '<span class="flag off">·</span>';

  function stageRow(r){
    const noMaster = r.st == null;
    const cells = noMaster
      ? `<td class="stg s0" colspan="14"><span class="nomaster">Pine Screener 名單中沒有這一檔</span></td>`
      : `<td class="stg s${r.st} sep"><span>${r.st}</span></td>
         <td class="num">${r.stw == null ? '—' : r.stw}</td>
         <td class="num sep" style="${brkTint(r.s1p)}">${fmtPct(r.s1p)}</td>
         <td class="num" style="${brkTint(r.s3p)}">${fmtPct(r.s3p)}</td>
         <td class="num" style="${brkTint(r.s3hp)}">${fmtPct(r.s3hp)}</td>
         <td class="num" style="${brkTint(r.s2p)}">${fmtPct(r.s2p)}</td>
         <td class="val sep">${fmtVal(r.s1v)}</td>
         <td class="val">${fmtVal(r.s3v)}</td>
         <td class="val">${fmtVal(r.s3hv)}</td>
         <td class="val">${fmtVal(r.s2v)}</td>
         <td class="sep">${flagCell(r.pw1)}</td>
         <td>${flagCell(r.pw3)}</td>
         <td class="val sep">${fmtVal(r.ws10)}</td>
         <td class="val">${fmtVal(r.ws30)}</td>`;
    return `<tr data-code="${esc(r.code)}">
      <td class="sticky${srcClass(r.src)}" title="${esc(r.src||'')}"><div class="tick"><span class="c">${esc(r.code)}</span><span class="nm" title="${esc(r.name)}">${esc(r.name)}</span></div></td>
      <td style="text-align:left"><span class="chip" title="${esc(r.group)}">${esc(r.group)}</span></td>
      ${cells}
    </tr>`;
  }

  function hasUp(r){ return CROSS.some(c => r[c.k] === 1); }
  function hasDn(r){ return CROSS.some(c => r[c.k] === -1); }

  /* 第一層是大類（由同步腳本歸戶），第二層才是原始族群。
     選大類會一併帶出底下所有細分族群；歸戶規則見 sync 腳本的 GROUP_ALIAS。 */
  /* 族群以外的條件：搜尋、快篩（追蹤欄位）或 Stage（Pine Stage）。
     族群鈕上的數字也用這個算——只數全部的話，鈕上寫 2 檔，
     開著 Stage 3 或 EMA21 正斜率時點下去卻可能是空表。 */
  function quickFilter(rows){
    if(state.q){
      const q = state.q;
      rows = rows.filter(r => (r.code+' '+r.name+' '+r.group+' '+r.theme).toLowerCase().includes(q));
    }
    if(state.view === 'stage'){
      if(state.stages && state.stages.size)
        rows = rows.filter(r => state.stages.has(r.st));
    } else {
      if(state.pos)   rows = rows.filter(r => r.d21 != null && r.d21 > 0.1);
      if(state.up)    rows = rows.filter(hasUp);
      if(state.dn)    rows = rows.filter(hasDn);
    }
    return rows;
  }

  /* 排序與細分用全部的列（鈕不會因為切快篩而跳位置），n 是目前條件下剩幾檔 */
  function themeMap(live){
    const m = new Map();
    for(const r of DATA.markets[state.mkt].rows){
      if(!m.has(r.theme)) m.set(r.theme, {all:0, n:0, subs:new Set()});
      const e = m.get(r.theme);
      e.all++; e.subs.add(r.group);
    }
    for(const r of live) m.get(r.theme).n++;
    return m;
  }

  function renderFilters(live){
    const m = themeMap(live);
    const themes = [...m.entries()].sort((a,b) => b[1].all - a[1].all || a[0].localeCompare(b[0],'zh-Hant'));
    $('#themes').innerHTML = themes.map(([t,e]) =>
      `<button class="gchip${e.n ? '' : ' zero'}" data-t="${esc(t)}" aria-pressed="${state.theme===t}"
        title="${e.n < e.all ? '目前條件下 ' + e.n + '／' + e.all + ' 檔' : e.all + ' 檔'}${e.subs.size > 1 ? '，含 ' + esc([...e.subs].join('、')) : ''}"
        >${esc(t)}<span class="n">${e.n}</span></button>`).join('');
    renderSubs(m);
  }

  function renderSubs(m){
    const box = $('#subs');
    const e = state.theme ? m.get(state.theme) : null;
    if(!e || e.subs.size < 2){ box.hidden = true; box.innerHTML = ''; return; }
    const subs = [...e.subs].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
    box.hidden = false;
    box.innerHTML = '<span class="lbl">細分</span>' + subs.map(g =>
      `<button class="schip" data-g="${esc(g)}" aria-pressed="${state.group===g}">${esc(g)}</button>`).join('');
  }

  $('#themes').addEventListener('click', e => {
    const b = e.target.closest('.gchip'); if(!b) return;
    const t = b.dataset.t;
    state.theme = state.theme === t ? null : t;
    state.group = null;                      // 換大類就放掉細分
    render(); syncOffsets();
  });

  $('#subs').addEventListener('click', e => {
    const b = e.target.closest('.schip'); if(!b) return;
    state.group = state.group === b.dataset.g ? null : b.dataset.g;
    document.querySelectorAll('.schip').forEach(c =>
      c.setAttribute('aria-pressed', c.dataset.g === state.group));
    render();
  });

  function tint(v){
    if(v == null) return '';
    const a = Math.min(Math.abs(v)/3, 1) * 0.16;
    if(v > 0.1) return `color:var(--pos);background:rgba(var(--pos-soft),${a.toFixed(3)})`;
    if(v < -0.1) return `color:var(--neg);background:rgba(var(--neg-soft),${a.toFixed(3)})`;
    return 'color:var(--flat)';
  }
  /* 穿越的新鮮度。age = 幾個「交易日」前穿的，0 = 最新一根收盤才剛穿。
     刻意用 K 棒數而不是日曆天：週末、國定假日沒有新 K 棒，age 就不會變，
     所以禮拜六重跑，禮拜五剛穿的還是 0，shade 不會因為「今天沒開盤」就退掉。 */
  const XAGE = [[0,.34],[1,.28],[3,.22],[6,.15]];
  function xShade(age){
    if(age == null) return .14;                 // 舊資料沒有 age，用原本的固定濃度
    for(const [lim,a] of XAGE) if(age <= lim) return a;
    return .09;
  }
  function xcell(v, age){
    if(v !== 1 && v !== -1) return '<span class="x no">·</span>';
    const up = v === 1;
    const fresh = age != null && age <= 1 ? ' fresh' : '';
    const t = age == null ? (up ? '近10日曾上穿' : '近10日曾下穿')
            : (age === 0 ? '最新一根收盤才剛' : age + ' 個交易日前') + (up ? '上穿' : '下穿');
    return `<span class="x ${up?'up':'dn'}${fresh}" title="${t}"
      style="background:rgba(var(${up?'--pos-soft':'--neg-soft'}),${xShade(age)})">${up?'↑':'↓'}</span>`;
  }

  /* 營收年增%：級距比斜率大得多（台股月營收可以到 +400），底色以 40% 封頂 */
  function revTint(v){
    if(v == null) return '';
    const a = Math.min(Math.abs(v)/40, 1) * 0.16;
    if(v > 0) return `color:var(--pos);background:rgba(var(--pos-soft),${a.toFixed(3)})`;
    if(v < 0) return `color:var(--neg);background:rgba(var(--neg-soft),${a.toFixed(3)})`;
    return 'color:var(--flat)';
  }

  /* 距 52 週新高幾週，分級同圖例：0 本週創高 / 1-4 近期 / 5-12 沉澱 / 13+ 落後 */
  const srcClass = v => v === '入選' ? ' pick' : v === '龍頭' ? ' lead' : '';

  function w52class(v){
    if(v == null) return '';
    if(v === 0) return ' new';
    if(v <= 4)  return ' hot';
    if(v <= 12) return ' mid';
    return ' cold';
  }

  function render(){
    renderStats();
    const mk = DATA.markets[state.mkt];
    let rows = quickFilter(mk.rows.slice());
    renderFilters(rows);

    if(state.theme) rows = rows.filter(r => r.theme === state.theme);
    if(state.group) rows = rows.filter(r => r.group === state.group);

    if(state.sort === 'group'){
      rows.sort((a,b) => a.group.localeCompare(b.group,'zh-Hant') || String(a.code).localeCompare(String(b.code)));
    } else {
      const k = state.sort;
      rows.sort((a,b) => {
        const av = a[k], bv = b[k];
        if(av == null && bv == null) return 0;
        if(av == null) return 1;
        if(bv == null) return -1;
        return (av - bv) * state.dir || a.group.localeCompare(b.group,'zh-Hant');
      });
    }

    $('#count').textContent = rows.length + ' / ' + mk.rows.length + ' 檔';
    $('#srclegend').hidden = !mk.rows.some(r => r.src === '入選' || r.src === '龍頭');

    const tb = $('#tbody'), em = $('#empty');
    if(!rows.length){
      tb.innerHTML = '';
      em.hidden = false;
      em.innerHTML = mk.rows.length
        ? '<span class="big">沒有符合條件的個股</span>換個篩選條件試試'
        : '<span class="big">' + mk.label + ' 目前沒有追蹤中的個股</span>下次跑篩選寫入後，這裡就會出現';
      return;
    }
    em.hidden = true;

    if(state.view === 'stage'){ tb.innerHTML = rows.map(stageRow).join(''); return; }

    tb.innerHTML = rows.map(r => {
      const slopes = SLOPES.map(s => {
        const v = r[s.k];
        return `<td class="slope${SEP[s.k]?' sep':''}" style="${tint(v)}">${v==null?'—':(v>0?'+':'')+v.toFixed(2)}</td>`;
      }).join('');
      const crosses = CROSS.map(c => `<td class="xc${SEP[c.k]?' sep':''}">${xcell(r[c.k], r['a'+c.k])}</td>`).join('');
      const revs = REV.map(o => {
        const v = r[o.k];
        return `<td class="rev${SEP[o.k]?' sep':''}" style="${revTint(v)}" title="${esc(r.revp||'')}"
          >${v==null?'—':(v>0?'+':'')+v.toFixed(1)}</td>`;
      }).join('');
      const soon = r.days != null && r.days <= 30;
      const w52t = r.w52 == null ? '資料不足'
                 : r.w52 === 0 ? '本週就是 52 週新高'
                 : `上次創 52 週新高在 ${r.w52} 週前`;
      return `<tr data-code="${esc(r.code)}">
        <td class="sticky${srcClass(r.src)}" title="${esc(r.src||'')}"><div class="tick"><span class="c">${esc(r.code)}</span><span class="nm" title="${esc(r.name)}">${esc(r.name)}</span></div></td>
        <td style="text-align:left"><span class="chip" title="${esc(r.group)}">${esc(r.group)}</span></td>
        ${slopes}${crosses}${revs}
        <td class="w52 sep${w52class(r.w52)}" title="${w52t}"><span>${r.w52==null?'—':r.w52}</span></td>
        <td class="days${soon?' soon':''}" title="寫入 ${esc(r.added)}">${r.days==null?'—':r.days}</td>
      </tr>`;
    }).join('');
  }

  const STAGE_NAME = {1:'打底', 2:'上升', 3:'做頭', 4:'下跌'};

  function renderToggles(){
    const stage = state.view === 'stage';
    $('#maToggles').hidden = stage;
    $('#stageToggles').hidden = !stage;
    /* setView 會把快篩歸零，鈕的按下狀態要跟著回來 */
    [['#tPos','pos'],['#tUp','up'],['#tDn','dn']].forEach(([sel,key]) =>
      $(sel).setAttribute('aria-pressed', state[key]));
    if(!stage) return;
    const mk = DATA.markets[state.mkt];
    $('#stageToggles').innerHTML = [1,2,3,4].map(n => {
      const c = mk.rows.filter(r => r.st === n).length;
      return `<button class="toggle" data-stage="${n}" aria-pressed="${state.stages.has(n)}"
        ><span class="dot" style="color:var(--${n===2?'pos':n===3?'neg':n===4?'warn':'flat'})"></span>Stage ${n} ${STAGE_NAME[n]}<span class="count" style="margin-left:5px">${c}</span></button>`;
    }).join('');
  }

  $('#stageToggles').addEventListener('click', e => {
    const b = e.target.closest('[data-stage]'); if(!b) return;
    const n = +b.dataset.stage;
    if(state.stages.has(n)) state.stages.delete(n); else state.stages.add(n);
    renderToggles(); render();
  });

  function renderStats(){
    const mk = DATA.markets[state.mkt], rows = mk.rows;
    if(state.view === 'stage'){
      const n = rows.length;
      const c = k => rows.filter(r => r.st === k).length;
      const miss = rows.filter(r => r.st == null).length;
      $('#stats').innerHTML = `
        <div class="stat"><span class="k">追蹤檔數</span><span class="v">${n}</span></div>
        <div class="stat"><span class="k">Stage 1 打底</span><span class="v">${c(1)}</span></div>
        <div class="stat pos"><span class="k">Stage 2 上升</span><span class="v">${c(2)}</span></div>
        <div class="stat neg"><span class="k">Stage 3 做頭</span><span class="v">${c(3)}</span></div>
        <div class="stat ${c(4)?'warn':''}"><span class="k">Stage 4 下跌</span><span class="v">${c(4)}<small>${miss?`　未對到 ${miss}`:''}</small></span></div>`;
      return;
    }
    const n = rows.length;
    const pos = rows.filter(r => r.d21 != null && r.d21 > 0.1).length;
    const up = rows.filter(hasUp).length;
    const dn = rows.filter(hasDn).length;
    const soon = rows.filter(r => r.days != null && r.days <= 30).length;
    const pct = n ? Math.round(pos/n*100) : 0;
    $('#stats').innerHTML = `
      <div class="stat"><span class="k">追蹤檔數</span><span class="v">${n}</span></div>
      <div class="stat pos"><span class="k">日EMA21 正斜率</span><span class="v">${pos}<small>／${n}　${pct}%</small></span></div>
      <div class="stat pos"><span class="k">近10日有上穿</span><span class="v">${up}</span></div>
      <div class="stat neg"><span class="k">近10日有下穿</span><span class="v">${dn}</span></div>
      <div class="stat ${soon?'warn':''}"><span class="k">30天內到期</span><span class="v">${soon}</span></div>`;
  }

  /* 表頭要釘在頁面 header 底下，高度隨字級/換行變動，實測後寫進 CSS 變數 */
  function syncOffsets(){
    const top  = document.querySelector('.top');
    const grp  = document.querySelector('thead tr:first-child th[colspan]');
    const root = document.documentElement.style;
    if(top) root.setProperty('--head-h', top.offsetHeight + 'px');
    if(grp) root.setProperty('--hrow-h', grp.offsetHeight + 'px');
  }
  window.addEventListener('resize', syncOffsets);

  /* 光靠 resize 事件不夠：字體載入完、切換模式讓頁籤變多變少、手機轉向，
     都會改變 header 高度，但不見得會觸發 resize。盯著元素本身最穩當。 */
  if(window.ResizeObserver){
    const ro = new ResizeObserver(syncOffsets);
    const top = document.querySelector('.top');
    if(top) ro.observe(top);
    const grp = document.querySelector('thead tr:first-child th[colspan]');
    if(grp) ro.observe(grp);
  }

  /* 只有串得上 Pine MASTER 的市場（台股）才給視圖切換 */
  function syncViewAvail(){
    const has = !!DATA.markets[state.mkt].master;
    $('#views').hidden = !has;
    if(!has && state.view !== 'ma'){
      state.view = 'ma'; state.stages = new Set();
      document.querySelectorAll('.vbtn').forEach(x =>
        x.setAttribute('aria-selected', x.dataset.v === 'ma'));
    }
  }

  renderTabs();
  syncViewAvail();
  renderHead();
  renderToggles();
  render();
  renderTrail();
  syncOffsets();
  }
})();
</script>
</body>
</html>
