<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<title>小論文經典追蹤板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">

<style>
:root{
  color-scheme:dark;
  --ground:#0e1218;
  --surface:#161c25;
  --surface-2:#1a212b;
  --surface-3:#212a36;
  --line:#262f3c;
  --line-strong:#36414f;
  --ink:#e7ecf3;
  --ink-2:#a9b3c2;
  --ink-3:#727e8e;
  --accent:#89a9dd;
  --accent-soft:rgba(137,169,221,.14);
  --pos:#41c08c;
  --pos-soft:65,192,140;
  --neg:#e29c45;
  --neg-soft:226,156,69;
  --flat:#6d7887;
  --warn:#ef7462;
  --warn-soft:rgba(239,116,98,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
  --r:10px;
  --sans:"Noto Sans TC",-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC",Georgia,"Songti TC",serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",monospace;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px 72px}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.top-in{--pad:20px;max-width:1400px;margin:0 auto;padding:16px var(--pad) 0;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{
  font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:.02em;
  margin:0;line-height:1.2;
}
.brand .sub{color:var(--ink-3);font-size:12.5px;letter-spacing:.04em}
.brand .sub b{color:var(--ink-2);font-weight:500;font-family:var(--mono)}

/* 追蹤板 / 週報 切換 */
.modes{
  display:flex;gap:2px;margin-left:auto;align-self:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;
}
.mode{
  appearance:none;border:0;background:none;cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-3);
  padding:5px 15px;border-radius:6px;
}
.mode:hover{color:var(--ink-2)}
.mode[aria-selected="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:2px;align-items:flex-end}
.tab{
  appearance:none;border:0;background:none;cursor:pointer;
  font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink-3);
  padding:9px 16px 11px;border-bottom:2px solid transparent;
  display:flex;align-items:center;gap:7px;
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab .n{
  font-family:var(--mono);font-size:11px;color:var(--ink-3);
  background:var(--surface-3);border-radius:20px;padding:1px 7px;
}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:6px 6px 0 0}

/* ---------- stats ---------- */
.stats{
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin:26px 0 20px;box-shadow:var(--shadow);
}
.stat{background:var(--surface);padding:13px 16px 14px;display:flex;flex-direction:column;gap:3px}
.stat .k{font-size:11px;letter-spacing:.09em;color:var(--ink-3);text-transform:uppercase}
.stat .v{font-family:var(--mono);font-size:23px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--ink-3);margin-left:3px;font-weight:400}
.stat.pos .v{color:var(--pos)}
.stat.neg .v{color:var(--neg)}
.stat.warn .v{color:var(--warn)}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{position:relative;flex:0 0 232px}
.search input{
  width:100%;font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;
  padding:8px 11px 8px 31px;
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.toggle{
  appearance:none;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink-2);font-family:var(--sans);font-size:13px;cursor:pointer;
  padding:7px 13px;border-radius:8px;display:flex;align-items:center;gap:6px;
}
.toggle:hover{border-color:var(--ink-3)}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.75}
/* 追蹤欄位 / Pine Stage 視圖切換 */
.views{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px}
.views[hidden]{display:none}
.vbtn{
  appearance:none;border:0;background:none;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-3);
  padding:4px 12px;border-radius:6px;
}
.vbtn:hover{color:var(--ink-2)}
.vbtn[aria-selected="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.vbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Weinstein 四階段：1 基底、2 上升、3 頭部、4 下跌。
   沿用表上既有的訊號色軸，不另外發明一套。 */
td.stg span{
  display:inline-block;min-width:22px;padding:2px 7px;border-radius:5px;
  font-family:var(--mono);font-size:12px;font-weight:700;text-align:center;
}
td.stg.s1 span{color:var(--ink-2);background:var(--surface-3)}
td.stg.s2 span{color:var(--pos);background:rgba(var(--pos-soft),.16)}
td.stg.s3 span{color:var(--neg);background:rgba(var(--neg-soft),.16)}
td.stg.s4 span{color:var(--warn);background:var(--warn-soft)}
td.stg.s0 span{color:var(--flat);background:var(--surface-3);opacity:.6}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
td.val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-3)}
.flag{
  display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:20px;border-radius:5px;font-size:11px;font-weight:700;
  color:var(--accent);background:var(--accent-soft);
}
.flag.off{color:var(--flat);background:none;opacity:.35;font-weight:400}
.nomaster{color:var(--ink-3);font-size:12px;opacity:.55}

.spacer{flex:1}
.count{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.groups{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.gchip{
  appearance:none;cursor:pointer;font-family:var(--sans);font-size:12.5px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  padding:4px 11px;border-radius:20px;
}
.gchip:hover{border-color:var(--line-strong)}
.gchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.gchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gchip .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:5px}
.gchip[aria-pressed="true"] .n{color:var(--surface);opacity:.7}
/* 第二層：選了大類之後才出現的細分族群 */
.subs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-10px 0 18px}
.subs .lbl{font-size:11px;color:var(--ink-3);letter-spacing:.08em;margin-right:1px}
.schip{
  appearance:none;cursor:pointer;font-family:var(--sans);font-size:12px;
  border:1px dashed var(--line-strong);background:transparent;color:var(--ink-3);
  padding:3px 10px;border-radius:20px;
}
.schip:hover{color:var(--ink-2);border-color:var(--ink-3)}
.schip[aria-pressed="true"]{
  background:var(--accent-soft);border-style:solid;border-color:var(--accent);
  color:var(--accent);font-weight:500;
}
.schip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- table ---------- */
.tablecard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);
}
/* 桌機不加 overflow，否則 sticky thead 會被關進捲動容器裡而釘不住 */
.tscroll{border-radius:var(--r)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1088px;table-layout:auto}
thead th{
  position:sticky;z-index:5;
  background:var(--surface-2);
  font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:.04em;
  text-align:right;padding:8px 7px;white-space:nowrap;
  border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;
}
thead tr:first-child th{top:var(--head-h,0px)}
thead tr:nth-child(2) th{top:calc(var(--head-h,0px) + var(--hrow-h,24px))}
thead th:hover{color:var(--ink)}
thead th.lt{text-align:left}
thead th.grp{
  font-size:10px;letter-spacing:.1em;
  text-align:center;color:var(--ink-3);background:var(--surface-3);
  cursor:default;padding:5px 8px;
}
thead th.grp:hover{color:var(--ink-3)}
thead th.span2{background:var(--surface-3)}
th .ar{opacity:0;margin-left:3px;font-size:9px}
th[data-dir] .ar{opacity:1;color:var(--accent)}
tbody td{
  padding:7px 7px;border-bottom:1px solid var(--line);
  font-size:13px;text-align:right;white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.sticky,th.sticky{
  position:sticky;left:0;z-index:6;background:var(--surface);
  text-align:left;border-right:1px solid var(--line);padding-left:12px;
}
thead th.sticky{z-index:8;background:var(--surface-2)}
tbody tr:hover td.sticky{background:var(--surface-2)}
/* 卡片圓角：沒有 overflow:hidden 可用，改讓角落儲存格自己圓 */
thead tr:first-child th:first-child{border-top-left-radius:var(--r)}
thead tr:first-child th:last-child{border-top-right-radius:var(--r)}
tbody tr:last-child td:first-child{border-bottom-left-radius:var(--r)}
tbody tr:last-child td:last-child{border-bottom-right-radius:var(--r)}
/* 個股欄的來源：入選是自己進過榜的，要跳出來；龍頭只是補進來的背景，壓低。
   用 inset box-shadow 當左側標記而不是 border，才不會動到欄寬。
   刻意避開綠／橘——那兩色在這張表已經是斜率與穿越的訊號色。 */
/* 首欄是 sticky 的，底色一定要不透明——半透明會讓橫向捲動時後面的數字透出來，
   跟股票名稱疊在一起（龍頭沒事，是因為它沿用 td.sticky 的實色底）。
   疊一層實色漸層在 surface 上，效果等同半透明但保持不透明。 */
td.sticky.pick{
  box-shadow:inset 3px 0 0 var(--accent);
  background:linear-gradient(rgba(137,169,221,.10),rgba(137,169,221,.10)),var(--surface);
}
tbody tr:hover td.sticky.pick{
  background:linear-gradient(rgba(137,169,221,.16),rgba(137,169,221,.16)),var(--surface-2);
}
td.sticky.pick .c{color:var(--ink);font-weight:700}
td.sticky.lead{box-shadow:inset 2px 0 0 var(--line-strong)}
td.sticky.lead .c,td.sticky.lead .nm{color:var(--ink-3)}

.srclegend{display:flex;gap:16px;align-items:center;margin:0 0 10px;font-size:11.5px}
.srclegend[hidden]{display:none}
.sl{display:flex;align-items:center;gap:6px}
.sl i{display:inline-block;width:3px;height:13px;border-radius:2px}
.sl.pick{color:var(--ink-2);font-weight:500}
.sl.pick i{background:var(--accent)}
.sl.lead{color:var(--ink-3)}
.sl.lead i{background:var(--line-strong);width:2px}
.sl small{color:var(--ink-3);font-weight:400}

.tick{display:flex;flex-direction:column;gap:0;line-height:1.25}
.tick .c{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.01em}
.tick .nm{
  font-size:11.5px;color:var(--ink-3);
  max-width:116px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chip{
  display:inline-block;font-size:11px;color:var(--ink-2);
  background:var(--surface-3);border-radius:5px;padding:2px 7px;white-space:nowrap;
  max-width:104px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;
}
td.slope{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500}
td.sep{border-left:1px solid var(--line)}
thead th.sep{border-left:1px solid var(--line)}
.x{
  display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:20px;border-radius:5px;font-size:12px;font-weight:700;
}
thead th.xc,tbody td.xc{padding-left:4px;padding-right:4px}
/* 營收年增%：正綠負橘，底色深淺隨幅度（40% 封頂） */
td.rev{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500}
.x.up{color:var(--pos);background:rgba(var(--pos-soft),.14)}
.x.dn{color:var(--neg);background:rgba(var(--neg-soft),.15)}
.x.no{color:var(--flat);opacity:.35;font-weight:400}
/* 剛變化：0~1 個交易日內穿的，除了底色最濃，再加一圈同色外框 */
.x.fresh{box-shadow:inset 0 0 0 1.5px currentColor}
td.days{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
td.days.soon{color:var(--warn);font-weight:600;background:var(--warn-soft)}
/* 距 52 週新高幾週：0＝本週創高，越大越久沒創高（分級同圖例） */
td.w52{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
td.w52 span{
  display:inline-block;min-width:26px;padding:2px 6px;border-radius:5px;text-align:center;
}
td.w52.new span{color:var(--pos);background:rgba(var(--pos-soft),.22);font-weight:700}
td.w52.hot span{color:var(--pos);background:rgba(var(--pos-soft),.12)}
td.w52.mid span{color:var(--ink-3);background:var(--surface-3)}
td.w52.cold span{color:var(--neg);background:rgba(var(--neg-soft),.16);font-weight:700}
/* 週報：用 iframe 隔離渲染。週報自己的 CSS 也用 .top / .wrap，
   直接注進頁面會跟追蹤板的樣式互相覆蓋。 */
.repcard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;margin-top:2px;
}
#repframe{display:block;width:100%;border:0;min-height:420px;background:var(--surface)}

/* 週報清單：一期一列，左邊期別、中間該期入選個股、右邊日期 */
.replist{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
}
.reprow{
  display:grid;grid-template-columns:minmax(152px,auto) 1fr auto;
  gap:6px 16px;align-items:baseline;width:100%;text-align:left;
  appearance:none;border:0;border-bottom:1px solid var(--line);background:none;
  color:var(--ink);font-family:var(--sans);cursor:pointer;padding:12px 16px;
}
.reprow:last-child{border-bottom:0}
.reprow:hover{background:var(--surface-2)}
.reprow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.reprow .rt{font-size:14px;font-weight:500;white-space:nowrap}
.reprow .rs{display:flex;flex-wrap:wrap;gap:4px 5px;min-width:0}
.reprow .rd{
  font-family:var(--mono);font-size:12px;color:var(--ink-3);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.st{
  font-size:11.5px;color:var(--ink-2);background:var(--surface-3);
  border-radius:5px;padding:1px 7px;white-space:nowrap;
}
.st b{font-family:var(--mono);font-weight:500;color:var(--ink-3);margin-right:4px}
.st.hot{color:var(--neg);background:rgba(var(--neg-soft),.13)}
.st.hot b{color:var(--neg);opacity:.75}
.st.clown{color:var(--ink-3)}
.st mark{background:rgba(137,169,221,.30);color:var(--ink);border-radius:2px;padding:0 1px}
.repcount{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-left:auto}
.backlink{
  appearance:none;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink-2);font-family:var(--sans);font-size:13px;cursor:pointer;
  padding:6px 13px;border-radius:8px;margin-bottom:12px;
}
.backlink:hover{border-color:var(--ink-3);color:var(--ink)}
.backlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:700px){
  /* 窄螢幕改成兩行：第一行期別＋日期，個股整排移到第二行。
     三個子元素在兩欄網格裡若靠自動排版，日期會被擠掉，所以明確指定格位。 */
  .reprow{grid-template-columns:1fr auto}
  .reprow .rt{grid-area:1/1/2/2}
  .reprow .rd{grid-area:1/2/2/3}
  .reprow .rs{grid-area:2/1/3/3}
}
.empty{padding:56px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.empty .big{font-family:var(--serif);font-size:17px;color:var(--ink-2);display:block;margin-bottom:6px}

/* 手機與平板 */
@media (max-width:1160px){
  /* 六個分頁在窄螢幕一定排不下，改成可橫向滑動的一條；
     負邊距讓它從螢幕左緣捲到右緣，不會卡在內距裡。 */
  .tabs{
    overflow-x:auto;overflow-y:hidden;
    margin:0 calc(-1 * var(--pad));padding:0 var(--pad);
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 12px 11px}

  /* 表格自己變成雙向捲動容器，表頭與首欄才有東西可以「黏」——
     沒有高度上限時 sticky 是無效的，因為容器根本不會垂直捲動。 */
  .tscroll{
    overflow:auto;
    max-height:calc(100vh - 24px);
    max-height:calc(100dvh - 24px);
  }
  thead tr:first-child th{top:0}
  thead tr:nth-child(2) th{top:var(--hrow-h,24px)}
  /* 頁面 header 若還是 sticky，會蓋住剛剛釘好的表頭 */
  .top{position:static}
}
@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:last-child{grid-column:1/-1}
  .brand h1{font-size:20px}
  .search{flex:1 1 100%}
  .wrap{padding:0 14px 56px}
  .top-in{--pad:14px;padding:14px var(--pad) 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<body>
<div class="gate" id="gate">

<script>
(function(){
  const ENV  = JSON.parse(document.getElementById('payload').textContent);
  const gate = document.getElementById('gate');
  const app  = document.getElementById('app');
  const form = document.getElementById('lockform');
  const pwin = document.getElementById('pw');
  const btn  = document.getElementById('unlock');
  const errp = document.getElementById('lockerr');
  const STORE = 'littleessay.pw';

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  function fail(msg){
    btn.disabled = false; btn.textContent = '進入';
    errp.textContent = msg; errp.hidden = false;
  }

  let KEY = null;   // 看板與週報共用同一組 salt，所以只導一次

  async function decrypt(pw){
    const km = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(ENV.salt), iterations:ENV.iters, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:b64(ENV.iv)}, key, b64(ENV.ct));
    KEY = key;
    return JSON.parse(new TextDecoder().decode(pt));
  }

  /* 週報各自是一個密文檔，點到才抓才解——全部塞進首頁的話，
     一年三個市場累積下來會變成好幾 MB 的單一檔案。 */
  const repCache = new Map();
  async function fetchReport(file){
    if(repCache.has(file)) return repCache.get(file);
    const res = await fetch('r/' + file, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const env = await res.json();
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(env.iv)}, KEY, b64(env.ct));
    const html = new TextDecoder().decode(pt);
    repCache.set(file, html);
    return html;
  }

  async function tryUnlock(pw, remember){
    btn.disabled = true; btn.textContent = '解鎖中…'; errp.hidden = true;
    try{
      const data = await decrypt(pw);
      if(remember){ try{ localStorage.setItem(STORE, pw); }catch(e){} }
      gate.remove(); app.hidden = false;
      boot(data);
      return true;
    }catch(e){
      try{ localStorage.removeItem(STORE); }catch(_){}
      pwin.value = ''; pwin.focus();
      fail('密碼不對，再試一次');
      return false;
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = pwin.value.trim();
    if(v) tryUnlock(v, true);
  });

  (async function(){
    if(!(window.crypto && crypto.subtle)){
      pwin.disabled = true;

      btn.disabled = true;
      return;
    }
    let saved = null;
    try{ saved = localStorage.getItem(STORE); }catch(e){}
    if(saved){
      btn.disabled = true; btn.textContent = '解鎖中…';

    } else {
      pwin.focus();
    }
  })();

  function boot(DATA){
  const SLOPES = [

  const $ = s => document.querySelector(s);

  /* header row 2 */
  /* 兩個視圖共用同一張表，只換表頭與表身。個股與族群固定不動。 */
  const MA_HEAD = `
    <tr>
      <th class="sticky lt grp" rowspan="2">個股</th>

      <th class="grp sep" colspan="3">週 SMA 斜率 %</th>
      <th class="grp sep" colspan="4" title="底色越濃＝越近期才穿越；外框＝0~1 個交易日內剛變化。以交易日計，休市日不會讓它退色">近10日穿越 · 日EMA</th>
      <th class="grp sep" colspan="3" title="底色越濃＝越近期才穿越；外框＝0~1 個交易日內剛變化。以交易日計，休市日不會讓它退色">近10日穿越 · 週SMA</th>
      <th class="grp sep" colspan="2">營收 YoY %</th>
      <th class="sep" rowspan="2" data-sort="w52">距52W高<span class="ar">▼</span></th>
      <th class="sep" rowspan="2" data-sort="days">剩餘<span class="ar">▼</span></th>
    </tr>
    <tr id="hrow"></tr>`;

  const STAGE_HEAD = `
    <tr>
      <th class="sticky lt grp" rowspan="2">個股</th>
      <th class="lt grp" rowspan="2">族群</th>
      <th class="sep" rowspan="2" data-sort="st" title="Weinstein 四階段：1 打底、2 上升、3 做頭、4 下跌">Stage<span class="ar">▼</span></th>
      <th rowspan="2" data-sort="stw" title="目前這個 Stage 已經持續幾週">連續週<span class="ar">▼</span></th>
      <th class="grp sep" colspan="4" title="現價距離該條線幾 %；正＝已在線上方">距突破線 %</th>
      <th class="grp sep" colspan="4">線值</th>
      <th class="grp sep" colspan="2" title="前一段波段是否曾觸發">前波</th>
      <th class="grp sep" colspan="2">週SMA</th>
    </tr>
    <tr id="hrow"></tr>`;

  const STAGE_SUBS = [
    {k:'s1p', label:'S1', cls:'sep'}, {k:'s3p', label:'S3'}, {k:'s3hp', label:'S3高'}, {k:'s2p', label:'S2高'},
    {k:'s1v', label:'S1', cls:'sep'}, {k:'s3v', label:'S3'}, {k:'s3hv', label:'S3高'}, {k:'s2v', label:'S2高'},
    {k:'pw1', label:'S1', cls:'sep'}, {k:'pw3', label:'S3'},
    {k:'ws10', label:'10', cls:'sep'}, {k:'ws30', label:'30'}
  ];

  const hcell = (o, cls) =>
    `<th class="${cls}${SEP[o.k]?' sep':''}" data-sort="${o.k}">${o.label}<span class="ar">▼</span></th>`;
  function renderHead(){
    $('#thead').innerHTML = state.view === 'stage' ? STAGE_HEAD : MA_HEAD;
    $('#hrow').innerHTML = state.view === 'stage'
      ? STAGE_SUBS.map(o => hcell(o, o.cls || '')).join('')
      : SLOPES.map(o=>hcell(o,'')).join('')
        + CROSS.map(o=>hcell(o,'xc')).join('')
        + REV.map(o=>hcell(o,'')).join('');
    /* 表頭是重建的，排序監聽要跟著重綁 */
    document.querySelectorAll('#thead th[data-sort]').forEach(th => {
      if(th.dataset.sort === state.sort){
        th.setAttribute('data-dir', state.dir);
        const a = th.querySelector('.ar');
        if(a) a.textContent = state.dir < 0 ? '▼' : '▲';
      }
      th.addEventListener('click', () => {
        const k = th.dataset.sort;
        state.dir = (state.sort === k) ? -state.dir : -1;
        state.sort = k;
        renderHead(); render();
      });
    });
  }

  const REPORTS = DATA.reports || [];
  const repMarkets = DATA.order.filter(m => REPORTS.some(r => r.market === m));

  function renderTabs(){
    const list = state.mode === 'board' ? DATA.order : repMarkets;
    $('#tabs').innerHTML = list.map(m => {
      const n = state.mode === 'board'
        ? DATA.markets[m].rows.length
        : REPORTS.filter(r => r.market === m).length;
      return `<button class="tab" role="tab" data-m="${m}" aria-selected="${m===state.mkt}"
        >${DATA.markets[m].label}<span class="n">${n}</span></button>`;
    }).join('');
  }

  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if(!b) return;
    state.mkt = b.dataset.m;
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.m===state.mkt));
    if(state.mode === 'board'){
      state.theme = null; state.group = null; state.sort='group'; state.dir=1;
      syncViewAvail();
      renderFilters(); renderHead(); renderToggles(); render();
    } else {
      state.rep = null; showReports();
    }
    syncOffsets();
  });

  /* ---------- 模式切換 ---------- */
  if(REPORTS.length) $('#modes').hidden = false;

  $('#modes').addEventListener('click', e => {
    const b = e.target.closest('.mode'); if(!b) return;
    setMode(b.dataset.mode);
  });

  function setMode(mode){
    if(mode === 'report' && !REPORTS.length) return;
    state.mode = mode;
    document.querySelectorAll('.mode').forEach(m =>
      m.setAttribute('aria-selected', m.dataset.mode === mode));
    $('#boardView').hidden  = mode !== 'board';
    $('#reportView').hidden = mode !== 'report';
    if(mode === 'report'){
      if(!repMarkets.includes(state.mkt)) state.mkt = repMarkets[0];
      renderTabs(); showReports();
    } else {
      renderTabs(); renderFilters(); render();
    }
    syncOffsets();
  }

  /* ---------- 週報 ---------- */
  /* 清單是入口：一期一列，右邊直接列出該期入選的個股，不用點進去才看得到。
     搜尋有查詢字時跨所有市場找，因為「哪一週提過這檔」比「這個市場有哪些期」有用。 */
  $('#repq').addEventListener('input', e => { state.repq = e.target.value.trim().toLowerCase(); showReports(); });
  $('#repback').addEventListener('click', () => { state.rep = null; showReports(); });

  function hit(r, q){
    if(!q) return true;
    if(((r.listTitle||'') + ' ' + r.title + ' ' + r.date + ' ' + r.label).toLowerCase().includes(q)) return true;
    return r.stocks.some(t => (t.code + ' ' + t.name).toLowerCase().includes(q));
  }

  function mark(text, q){
    const t = esc(text);
    if(!q) return t;
    const i = text.toLowerCase().indexOf(q);
    if(i < 0) return t;
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length))
         + '</mark>' + esc(text.slice(i + q.length));
  }

  function showReports(){
    const q = state.repq || '';
    /* 有查詢字就跨市場找，沒有就只看目前分頁 */
    const list = REPORTS.filter(r => (q ? true : r.market === state.mkt) && hit(r, q));

    $('#repList').hidden = !!state.rep;
    $('#repDoc').hidden  = !state.rep;
    if(state.rep){ openReport(state.rep); return; }

    $('#repcount').textContent = q
      ? list.length + ' / ' + REPORTS.length + ' 期（全市場）'
      : list.length + ' 期';

    const box = $('#replist'), empty = $('#repempty');
    if(!list.length){
      box.innerHTML = ''; box.hidden = true; empty.hidden = false;
      empty.innerHTML = q
        ? '<span class="big">沒有符合的週報</span>試試代號、公司名或日期'
        : '<span class="big">' + DATA.markets[state.mkt].label + ' 還沒有週報</span>'
          + '把 &lt;市場&gt;-&lt;日期&gt;.html 放進 weekly_reports 資料夾，下次同步就會出現';
      return;
    }
    box.hidden = false; empty.hidden = true;
    box.innerHTML = list.map(r => {
      const stocks = r.stocks.map(t =>
        `<span class="st${t.tag ? ' ' + t.tag : ''}"${t.tag === 'hot' ? ' title="過熱區"' : t.tag === 'clown' ? ' title="基本面存疑"' : ''}
          ><b>${mark(t.code, q)}</b>${mark(t.name, q)}</span>`).join('');
      return `<button class="reprow" data-f="${r.file}">
        <span class="rt">${mark(r.listTitle || r.title, q)}</span>
        <span class="rs">${stocks}</span>
        <span class="rd">${r.stocks.length} 檔</span>
      </button>`;
    }).join('');
  }

  $('#replist').addEventListener('click', e => {
    const b = e.target.closest('.reprow'); if(!b) return;
    state.rep = b.dataset.f;
    showReports();
    window.scrollTo(0, 0);
  });

  async function openReport(file){
    const meta = REPORTS.find(r => r.file === file);
    const card = $('#repcard');
    if(!meta){ state.rep = null; showReports(); return; }
    try{
      const html = await fetchReport(file);
      const f = $('#repframe');
      f.onload = sizeFrame;
      f.srcdoc = html;
      card.hidden = false;
    }catch(err){
      card.hidden = true;
      $('#repDoc').insertAdjacentHTML('beforeend',
        '<div class="empty"><span class="big">這份週報讀不到</span>'
        + esc(String(err && err.message || err)) + '</div>');
    }
  }

  /* srcdoc 的高度外面量不到，載完後照內容撐開，才不會出現兩層捲軸 */
  function sizeFrame(){
    const f = $('#repframe');
    try{
      const d = f.contentDocument;
      if(d && d.documentElement) f.style.height = (d.documentElement.scrollHeight + 8) + 'px';
    }catch(e){}
  }
  window.addEventListener('resize', sizeFrame);

  /* controls */
  $('#q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
  [['#tPos','pos'],['#tUp','up'],['#tDn','dn']].forEach(([sel,key]) => {
    $(sel).addEventListener('click', e => {

  /* ---------- 視圖切換 ---------- */
  $('#views').addEventListener('click', e => {
    const b = e.target.closest('.vbtn'); if(!b) return;
    setView(b.dataset.v);
  });

  function setView(v){
    if(v === state.view) return;
    state.view = v;
    state.pos = state.up = state.dn = false;        // 兩邊的快篩條件不共用
    state.stages = new Set();

    document.querySelectorAll('.vbtn').forEach(x =>
      x.setAttribute('aria-selected', x.dataset.v === v));
    renderHead(); renderToggles(); render(); syncOffsets();
  }

  const fmtPct = v => v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(1);
  const fmtVal = v => v == null ? '—' : (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1));

  /* 距突破線 %：正＝已在線上方。級距很大（可到 +3000%），底色 30% 封頂 */
  function brkTint(v){
    if(v == null) return '';
    const a = Math.min(Math.abs(v)/30, 1) * 0.16;
    if(v > 0) return `color:var(--pos);background:rgba(var(--pos-soft),${a.toFixed(3)})`;
    if(v < 0) return `color:var(--neg);background:rgba(var(--neg-soft),${a.toFixed(3)})`;
    return 'color:var(--flat)';
  }

  const flagCell = v => v === 1
    ? '<span class="flag">✓</span>'
    : '<span class="flag off">·</span>';

  function stageRow(r){
    const noMaster = r.st == null;
    const cells = noMaster
      ? `<td class="stg s0" colspan="14"><span class="nomaster">Pine Screener 名單中沒有這一檔</span></td>`
      : `<td class="stg s${r.st} sep"><span>${r.st}</span></td>
         <td class="num">${r.stw == null ? '—' : r.stw}</td>
         <td class="num sep" style="${brkTint(r.s1p)}">${fmtPct(r.s1p)}</td>
         <td class="num" style="${brkTint(r.s3p)}">${fmtPct(r.s3p)}</td>
         <td class="num" style="${brkTint(r.s3hp)}">${fmtPct(r.s3hp)}</td>
         <td class="num" style="${brkTint(r.s2p)}">${fmtPct(r.s2p)}</td>
         <td class="val sep">${fmtVal(r.s1v)}</td>
         <td class="val">${fmtVal(r.s3v)}</td>
         <td class="val">${fmtVal(r.s3hv)}</td>
         <td class="val">${fmtVal(r.s2v)}</td>
         <td class="sep">${flagCell(r.pw1)}</td>
         <td>${flagCell(r.pw3)}</td>
         <td class="val sep">${fmtVal(r.ws10)}</td>
         <td class="val">${fmtVal(r.ws30)}</td>`;
    return `<tr>
      <td class="sticky${srcClass(r.src)}" title="${esc(r.src||'')}"><div class="tick"><span class="c">${esc(r.code)}</span><span class="nm" title="${esc(r.name)}">${esc(r.name)}</span></div></td>
      <td style="text-align:left"><span class="chip" title="${esc(r.group)}">${esc(r.group)}</span></td>
      ${cells}
    </tr>`;
  }

  function hasUp(r){ return CROSS.some(c => r[c.k] === 1); }
  function hasDn(r){ return CROSS.some(c => r[c.k] === -1); }

  /* 第一層是大類（由同步腳本歸戶），第二層才是原始族群。
     選大類會一併帶出底下所有細分族群；歸戶規則見 sync 腳本的 GROUP_ALIAS。 */
  function themeMap(){
    const m = new Map();
    for(const r of DATA.markets[state.mkt].rows){
      if(!m.has(r.theme)) m.set(r.theme, {n:0, subs:new Set()});
      const e = m.get(r.theme);
      e.n++; e.subs.add(r.group);
    }
    return m;
  }

  function renderFilters(){
    const m = themeMap();
    const themes = [...m.entries()].sort((a,b) => b[1].n - a[1].n || a[0].localeCompare(b[0],'zh-Hant'));
    $('#themes').innerHTML = themes.map(([t,e]) =>
      `<button class="gchip" data-t="${esc(t)}" aria-pressed="${state.theme===t}"
        title="${e.subs.size > 1 ? '含 ' + [...e.subs].join('、') : e.n + ' 檔'}"
        >${esc(t)}<span class="n">${e.n}</span></button>`).join('');
    renderSubs(m);
  }

  function renderSubs(m){
    const box = $('#subs');
    const e = state.theme ? m.get(state.theme) : null;
    if(!e || e.subs.size < 2){ box.hidden = true; box.innerHTML = ''; return; }
    const subs = [...e.subs].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
    box.hidden = false;
    box.innerHTML = '<span class="lbl">細分</span>' + subs.map(g =>
      `<button class="schip" data-g="${esc(g)}" aria-pressed="${state.group===g}">${esc(g)}</button>`).join('');
  }

  $('#themes').addEventListener('click', e => {
    const b = e.target.closest('.gchip'); if(!b) return;
    const t = b.dataset.t;
    state.theme = state.theme === t ? null : t;
    state.group = null;                      // 換大類就放掉細分
    renderFilters(); render(); syncOffsets();
  });

  $('#subs').addEventListener('click', e => {
    const b = e.target.closest('.schip'); if(!b) return;
    state.group = state.group === b.dataset.g ? null : b.dataset.g;
    document.querySelectorAll('.schip').forEach(c =>
      c.setAttribute('aria-pressed', c.dataset.g === state.group));
    render();
  });

  function tint(v){
    if(v == null) return '';
    const a = Math.min(Math.abs(v)/3, 1) * 0.16;
    if(v > 0.1) return `color:var(--pos);background:rgba(var(--pos-soft),${a.toFixed(3)})`;
    if(v < -0.1) return `color:var(--neg);background:rgba(var(--neg-soft),${a.toFixed(3)})`;
    return 'color:var(--flat)';
  }
  /* 穿越的新鮮度。age = 幾個「交易日」前穿的，0 = 最新一根收盤才剛穿。
     刻意用 K 棒數而不是日曆天：週末、國定假日沒有新 K 棒，age 就不會變，
     所以禮拜六重跑，禮拜五剛穿的還是 0，shade 不會因為「今天沒開盤」就退掉。 */
  const XAGE = [[0,.34],[1,.28],[3,.22],[6,.15]];
  function xShade(age){
    if(age == null) return .14;                 // 舊資料沒有 age，用原本的固定濃度
    for(const [lim,a] of XAGE) if(age <= lim) return a;
    return .09;
  }
  function xcell(v, age){
    if(v !== 1 && v !== -1) return '<span class="x no">·</span>';
    const up = v === 1;
    const fresh = age != null && age <= 1 ? ' fresh' : '';
    const t = age == null ? (up ? '近10日曾上穿' : '近10日曾下穿')
            : (age === 0 ? '最新一根收盤才剛' : age + ' 個交易日前') + (up ? '上穿' : '下穿');
    return `<span class="x ${up?'up':'dn'}${fresh}" title="${t}"
      style="background:rgba(var(${up?'--pos-soft':'--neg-soft'}),${xShade(age)})">${up?'↑':'↓'}</span>`;
  }

  /* 營收年增%：級距比斜率大得多（台股月營收可以到 +400），底色以 40% 封頂 */
  function revTint(v){
    if(v == null) return '';
    const a = Math.min(Math.abs(v)/40, 1) * 0.16;
    if(v > 0) return `color:var(--pos);background:rgba(var(--pos-soft),${a.toFixed(3)})`;
    if(v < 0) return `color:var(--neg);background:rgba(var(--neg-soft),${a.toFixed(3)})`;
    return 'color:var(--flat)';
  }

  /* 距 52 週新高幾週，分級同圖例：0 本週創高 / 1-4 近期 / 5-12 沉澱 / 13+ 落後 */
  const srcClass = v => v === '入選' ? ' pick' : v === '龍頭' ? ' lead' : '';

  function w52class(v){
    if(v == null) return '';
    if(v === 0) return ' new';
    if(v <= 4)  return ' hot';
    if(v <= 12) return ' mid';
    return ' cold';
  }

  function render(){
    renderStats();
    const mk = DATA.markets[state.mkt];
    let rows = mk.rows.slice();

    if(state.q){
      const q = state.q;
      rows = rows.filter(r => (r.code+' '+r.name+' '+r.group+' '+r.theme).toLowerCase().includes(q));
    }
    if(state.theme) rows = rows.filter(r => r.theme === state.theme);
    if(state.group) rows = rows.filter(r => r.group === state.group);
    if(state.view === 'stage'){
      if(state.stages && state.stages.size)
        rows = rows.filter(r => state.stages.has(r.st));
    } else {
      if(state.pos)   rows = rows.filter(r => r.d21 != null && r.d21 > 0.1);
      if(state.up)    rows = rows.filter(hasUp);
      if(state.dn)    rows = rows.filter(hasDn);
    }

    if(state.sort === 'group'){
      rows.sort((a,b) => a.group.localeCompare(b.group,'zh-Hant') || String(a.code).localeCompare(String(b.code)));
    } else {
      const k = state.sort;
      rows.sort((a,b) => {
        const av = a[k], bv = b[k];
        if(av == null && bv == null) return 0;
        if(av == null) return 1;
        if(bv == null) return -1;
        return (av - bv) * state.dir || a.group.localeCompare(b.group,'zh-Hant');
      });
    }

    $('#count').textContent = rows.length + ' / ' + mk.rows.length + ' 檔';
    $('#srclegend').hidden = !mk.rows.some(r => r.src === '入選' || r.src === '龍頭');

    const tb = $('#tbody'), em = $('#empty');
    if(!rows.length){
      tb.innerHTML = '';
      em.hidden = false;
      em.innerHTML = mk.rows.length
        ? '<span class="big">沒有符合條件的個股</span>換個篩選條件試試'
        : '<span class="big">' + mk.label + ' 目前沒有追蹤中的個股</span>下次跑篩選寫入後，這裡就會出現';
      return;
    }
    em.hidden = true;

    if(state.view === 'stage'){ tb.innerHTML = rows.map(stageRow).join(''); return; }

    tb.innerHTML = rows.map(r => {
      const slopes = SLOPES.map(s => {
        const v = r[s.k];
        return `<td class="slope${SEP[s.k]?' sep':''}" style="${tint(v)}">${v==null?'—':(v>0?'+':'')+v.toFixed(2)}</td>`;
      }).join('');
      const crosses = CROSS.map(c => `<td class="xc${SEP[c.k]?' sep':''}">${xcell(r[c.k], r['a'+c.k])}</td>`).join('');
      const revs = REV.map(o => {
        const v = r[o.k];
        return `<td class="rev${SEP[o.k]?' sep':''}" style="${revTint(v)}" title="${esc(r.revp||'')}"
          >${v==null?'—':(v>0?'+':'')+v.toFixed(1)}</td>`;
      }).join('');
      const soon = r.days != null && r.days <= 30;
      const w52t = r.w52 == null ? '資料不足'
                 : r.w52 === 0 ? '本週就是 52 週新高'
                 : `上次創 52 週新高在 ${r.w52} 週前`;
      return `<tr>
        <td class="sticky${srcClass(r.src)}" title="${esc(r.src||'')}"><div class="tick"><span class="c">${esc(r.code)}</span><span class="nm" title="${esc(r.name)}">${esc(r.name)}</span></div></td>
        <td style="text-align:left"><span class="chip" title="${esc(r.group)}">${esc(r.group)}</span></td>
        ${slopes}${crosses}${revs}
        <td class="w52 sep${w52class(r.w52)}" title="${w52t}"><span>${r.w52==null?'—':r.w52}</span></td>
        <td class="days${soon?' soon':''}" title="寫入 ${esc(r.added)}">${r.days==null?'—':r.days}</td>
      </tr>`;
    }).join('');
  }

  const STAGE_NAME = {1:'打底', 2:'上升', 3:'做頭', 4:'下跌'};

  function renderToggles(){
    const stage = state.view === 'stage';
    $('#maToggles').hidden = stage;
    $('#stageToggles').hidden = !stage;
    if(!stage) return;
    const mk = DATA.markets[state.mkt];
    $('#stageToggles').innerHTML = [1,2,3,4].map(n => {
      const c = mk.rows.filter(r => r.st === n).length;
      return `<button class="toggle" data-stage="${n}" aria-pressed="${state.stages.has(n)}"
        ><span class="dot" style="color:var(--${n===2?'pos':n===3?'neg':n===4?'warn':'flat'})"></span>Stage ${n} ${STAGE_NAME[n]}<span class="count" style="margin-left:5px">${c}</span></button>`;
    }).join('');
  }

  $('#stageToggles').addEventListener('click', e => {
    const b = e.target.closest('[data-stage]'); if(!b) return;
    const n = +b.dataset.stage;
    if(state.stages.has(n)) state.stages.delete(n); else state.stages.add(n);
    renderToggles(); render();
  });

  function renderStats(){
    const mk = DATA.markets[state.mkt], rows = mk.rows;
    if(state.view === 'stage'){
      const n = rows.length;
      const c = k => rows.filter(r => r.st === k).length;
      const miss = rows.filter(r => r.st == null).length;
      $('#stats').innerHTML = `
        <div class="stat"><span class="k">追蹤檔數</span><span class="v">${n}</span></div>
        <div class="stat"><span class="k">Stage 1 打底</span><span class="v">${c(1)}</span></div>
        <div class="stat pos"><span class="k">Stage 2 上升</span><span class="v">${c(2)}</span></div>
        <div class="stat neg"><span class="k">Stage 3 做頭</span><span class="v">${c(3)}</span></div>
        <div class="stat ${c(4)?'warn':''}"><span class="k">Stage 4 下跌</span><span class="v">${c(4)}<small>${miss?`　未對到 ${miss}`:''}</small></span></div>`;
      return;
    }
    const n = rows.length;
    const pos = rows.filter(r => r.d21 != null && r.d21 > 0.1).length;
    const up = rows.filter(hasUp).length;
    const dn = rows.filter(hasDn).length;
    const soon = rows.filter(r => r.days != null && r.days <= 30).length;
    const pct = n ? Math.round(pos/n*100) : 0;
    $('#stats').innerHTML = `
      <div class="stat"><span class="k">追蹤檔數</span><span class="v">${n}</span></div>
      <div class="stat pos"><span class="k">日EMA21 正斜率</span><span class="v">${pos}<small>／${n}　${pct}%</small></span></div>
      <div class="stat pos"><span class="k">近10日有上穿</span><span class="v">${up}</span></div>
      <div class="stat neg"><span class="k">近10日有下穿</span><span class="v">${dn}</span></div>
      <div class="stat ${soon?'warn':''}"><span class="k">30天內到期</span><span class="v">${soon}</span></div>`;
  }

  /* 表頭要釘在頁面 header 底下，高度隨字級/換行變動，實測後寫進 CSS 變數 */
  function syncOffsets(){
    const top  = document.querySelector('.top');
    const grp  = document.querySelector('thead tr:first-child th[colspan]');
    const root = document.documentElement.style;
    if(top) root.setProperty('--head-h', top.offsetHeight + 'px');
    if(grp) root.setProperty('--hrow-h', grp.offsetHeight + 'px');
  }
  window.addEventListener('resize', syncOffsets);

  /* 光靠 resize 事件不夠：字體載入完、切換模式讓頁籤變多變少、手機轉向，
     都會改變 header 高度，但不見得會觸發 resize。盯著元素本身最保險。 */
  if(window.ResizeObserver){
    const ro = new ResizeObserver(syncOffsets);
    const top = document.querySelector('.top');
    if(top) ro.observe(top);
    const grp = document.querySelector('thead tr:first-child th[colspan]');
    if(grp) ro.observe(grp);
  }

  /* 只有串得上 Pine MASTER 的市場（台股）才給視圖切換 */
  function syncViewAvail(){
    const has = !!DATA.markets[state.mkt].master;
    $('#views').hidden = !has;
    if(!has && state.view !== 'ma'){
      state.view = 'ma'; state.stages = new Set();
      document.querySelectorAll('.vbtn').forEach(x =>
        x.setAttribute('aria-selected', x.dataset.v === 'ma'));
    }
  }

  renderTabs();
  syncViewAvail();
  renderFilters();
  renderHead();
  renderToggles();
  render();
  syncOffsets();
  }
})();
</script>
</body>
</html>
