<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<title>小論文經典追蹤板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">

<style>
:root{
  color-scheme:dark;
  --ground:#0e1218;
  --surface:#161c25;
  --surface-2:#1a212b;
  --surface-3:#212a36;
  --line:#262f3c;
  --line-strong:#36414f;
  --ink:#e7ecf3;
  --ink-2:#a9b3c2;
  --ink-3:#727e8e;
  --accent:#89a9dd;
  --accent-soft:rgba(137,169,221,.14);
  --pos:#41c08c;
  --pos-soft:65,192,140;
  --neg:#e29c45;
  --neg-soft:226,156,69;
  --flat:#6d7887;
  --warn:#ef7462;
  --warn-soft:rgba(239,116,98,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
  --r:10px;
  --sans:"Noto Sans TC",-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC",Georgia,"Songti TC",serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",monospace;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px 72px}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.top-in{--pad:20px;max-width:1400px;margin:0 auto;padding:16px var(--pad) 0;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{
  font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:.02em;
  margin:0;line-height:1.2;
}
.brand .sub{color:var(--ink-3);font-size:12.5px;letter-spacing:.04em}
.brand .sub b{color:var(--ink-2);font-weight:500;font-family:var(--mono)}

/* 追蹤板 / 週報 切換 */
.modes{
  display:flex;gap:2px;margin-left:auto;align-self:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;
}
.mode{
  appearance:none;border:0;background:none;cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-3);
  padding:5px 15px;border-radius:6px;
}
.mode:hover{color:var(--ink-2)}
.mode[aria-selected="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:2px;align-items:flex-end}
.tab{
  appearance:none;border:0;background:none;cursor:pointer;
  font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink-3);
  padding:9px 16px 11px;border-bottom:2px solid transparent;
  display:flex;align-items:center;gap:7px;
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab .n{
  font-family:var(--mono);font-size:11px;color:var(--ink-3);
  background:var(--surface-3);border-radius:20px;padding:1px 7px;
}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:6px 6px 0 0}

/* ---------- 週報跑馬燈 ---------- */
/* 追蹤板頂上的橫帶：這個市場的週報提過哪些股，新的排前面。
   自己會走，滑鼠移上去就停，也可以直接用滾輪或手指撥。 */
.trail{
  position:relative;display:flex;align-items:stretch;margin:20px 0 0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow);
}
.trail .tlab{
  flex:0 0 auto;display:flex;align-items:center;padding:0 13px;
  border-right:1px solid var(--line);background:var(--surface-2);
  font-size:11px;letter-spacing:.09em;color:var(--ink-3);white-space:nowrap;
}
.trail-clip{
  position:relative;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;
}
.trail-clip::-webkit-scrollbar{display:none}
.trail-track{display:flex;width:max-content;gap:6px;padding:9px 13px}
/* 右緣淡出，暗示後面還有 */
.trail .tfade{
  position:absolute;top:1px;right:0;bottom:1px;width:36px;pointer-events:none;
  background:linear-gradient(to left,var(--surface),transparent);
}
.tk{
  appearance:none;border:0;cursor:pointer;font-family:var(--sans);
  font-size:11.5px;color:var(--ink-2);background:var(--surface-3);
  border-radius:5px;padding:3px 9px;white-space:nowrap;
}
.tk:hover{color:var(--ink);background:var(--line-strong)}
.tk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tk b{font-family:var(--mono);font-weight:500;color:var(--ink-3);margin-right:4px}
.tk:hover b{color:var(--ink-2)}
.tk .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-left:5px}
.tk.hot{color:var(--neg);background:rgba(var(--neg-soft),.13)}
.tk.hot b{color:var(--neg);opacity:.75}
.tk.clown{color:var(--ink-3)}
/* Stage 徽章：顏色跟表格裡的 Stage 欄一致，掃過去是同一套語彙 */
.tk .sg{
  display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;
  font-family:var(--mono);font-size:10px;
  color:var(--ink-2);background:var(--surface-2);
}
.tk.s2 .sg{color:var(--pos);background:rgba(var(--pos-soft),.16)}
.tk.s3 .sg{color:var(--neg);background:rgba(var(--neg-soft),.16)}
.tk.s4 .sg{color:var(--warn);background:var(--warn-soft)}
/* 點跑馬燈跳到表格裡那一列時閃一下，否則在幾十列裡找不到自己剛點的是哪一列 */
@keyframes trail-flash{from{background:var(--accent-soft)}to{background:transparent}}
tbody tr.flash > td{animation:trail-flash 2.2s ease-out}
@media (hover:none), (max-width:700px){
  /* 手指比游標粗：沒有滑鼠的裝置（含平板）把可點範圍加大 */
  .trail-track{gap:7px;padding:8px 12px}
  .tk{padding:6px 11px;font-size:12px}
}
@media (max-width:700px){
  .trail .tlab{padding:0 11px;font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){
  tbody tr.flash > td{animation:none;background:var(--accent-soft)}
}

/* ---------- stats ---------- */
.stats{
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin:26px 0 20px;box-shadow:var(--shadow);
}
.stat{background:var(--surface);padding:13px 16px 14px;display:flex;flex-direction:column;gap:3px}
.stat .k{font-size:11px;letter-spacing:.09em;color:var(--ink-3);text-transform:uppercase}
.stat .v{font-family:var(--mono);font-size:23px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--ink-3);margin-left:3px;font-weight:400}
.stat.pos .v{color:var(--pos)}
.stat.neg .v{color:var(--neg)}
.stat.warn .v{color:var(--warn)}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{position:relative;flex:0 0 232px}
.search input{
  width:100%;font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;
  padding:8px 11px 8px 31px;
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.toggle{
  appearance:none;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink-2);font-family:var(--sans);font-size:13px;cursor:pointer;
  padding:7px 13px;border-radius:8px;display:flex;align-items:center;gap:6px;
}
.toggle:hover{border-color:var(--ink-3)}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.75}
/* 追蹤欄位 / Pine Stage 視圖切換 */
.views{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px}
.views[hidden]{display:none}
.vbtn{
  appearance:none;border:0;background:none;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-3);
  padding:4px 12px;border-radius:6px;
}
.vbtn:hover{color:var(--ink-2)}
.vbtn[aria-selected="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.vbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Weinstein 四階段：1 基底、2 上升、3 頭部、4 下跌。
   沿用表上既有的訊號色軸，不另外發明一套。 */
td.stg span{
  display:inline-block;min-width:22px;padding:2px 7px;border-radius:5px;
  font-family:var(--mono);font-size:12px;font-weight:700;text-align:center;
}
td.stg.s1 span{color:var(--ink-2);background:var(--surface-3)}
td.stg.s2 span{color:var(--pos);background:rgba(var(--pos-soft),.16)}
td.stg.s3 span{color:var(--neg);background:rgba(var(--neg-soft),.16)}
td.stg.s4 span{color:var(--warn);background:var(--warn-soft)}
td.stg.s0 span{color:var(--flat);background:var(--surface-3);opacity:.6}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
td.val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-3)}
.flag{
  display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:20px;border-radius:5px;font-size:11px;font-weight:700;
  color:var(--accent);background:var(--accent-soft);
}
.flag.off{color:var(--flat);background:none;opacity:.35;font-weight:400}
.nomaster{color:var(--ink-3);font-size:12px;opacity:.55}

.spacer{flex:1}
.count{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* 兩組快篩鈕依視圖切換。display:contents 不能寫在 inline style：
   inline 的 display 會蓋過 [hidden]，另一組就永遠藏不起來 */
#maToggles:not([hidden]),#stageToggles:not([hidden]){display:contents}

.groups{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.gchip{
  appearance:none;cursor:pointer;font-family:var(--sans);font-size:12.5px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  padding:4px 11px;border-radius:20px;
}
.gchip:hover{border-color:var(--line-strong)}
.gchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.gchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gchip .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:5px}
.gchip[aria-pressed="true"] .n{color:var(--surface);opacity:.7}
/* 在目前的搜尋／快篩／Stage 條件下一檔都沒有：點了只會是空表，淡掉 */
.gchip.zero{opacity:.4}
/* 第二層：選了大類之後才出現的細分族群 */
.subs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-10px 0 18px}
.subs .lbl{font-size:11px;color:var(--ink-3);letter-spacing:.08em;margin-right:1px}
.schip{
  appearance:none;cursor:pointer;font-family:var(--sans);font-size:12px;
  border:1px dashed var(--line-strong);background:transparent;color:var(--ink-3);
  padding:3px 10px;border-radius:20px;
}
.schip:hover{color:var(--ink-2);border-color:var(--ink-3)}
.schip[aria-pressed="true"]{
  background:var(--accent-soft);border-style:solid;border-color:var(--accent);
  color:var(--accent);font-weight:500;
}
.schip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- table ---------- */
.tablecard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);
}
/* 桌機不加 overflow，否則 sticky thead 會被關進捲動容器裡而釘不住 */
.tscroll{border-radius:var(--r)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1088px;table-layout:auto}
thead th{
  position:sticky;z-index:5;
  background:var(--surface-2);
  font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:.04em;
  text-align:right;padding:8px 7px;white-space:nowrap;
  border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;
}
thead tr:first-child th{top:var(--head-h,0px)}
thead tr:nth-child(2) th{top:calc(var(--head-h,0px) + var(--hrow-h,24px))}
thead th:hover{color:var(--ink)}
thead th.lt{text-align:left}
thead th.grp{
  font-size:10px;letter-spacing:.1em;
  text-align:center;color:var(--ink-3);background:var(--surface-3);
  cursor:default;padding:5px 8px;
}
thead th.grp:hover{color:var(--ink-3)}
thead th.span2{background:var(--surface-3)}
th .ar{opacity:0;margin-left:3px;font-size:9px}
th[data-dir] .ar{opacity:1;color:var(--accent)}
tbody td{
  padding:7px 7px;border-bottom:1px solid var(--line);
  font-size:13px;text-align:right;white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.sticky,th.sticky{
  position:sticky;left:0;z-index:6;background:var(--surface);
  text-align:left;border-right:1px solid var(--line);padding-left:12px;
}
thead th.sticky{z-index:8;background:var(--surface-2)}
tbody tr:hover td.sticky{background:var(--surface-2)}
/* 卡片圓角：沒有 overflow:hidden 可用，改讓角落儲存格自己圓 */
thead tr:first-child th:first-child{border-top-left-radius:var(--r)}
thead tr:first-child th:last-child{border-top-right-radius:var(--r)}
tbody tr:last-child td:first-child{border-bottom-left-radius:var(--r)}
tbody tr:last-child td:last-child{border-bottom-right-radius:var(--r)}
/* 個股欄的來源：入選是自己進過榜的，要跳出來；龍頭只是補進來的背景，壓低。
   用 inset box-shadow 當左側標記而不是 border，才不會動到欄寬。
   刻意避開綠／橘——那兩色在這張表已經是斜率與穿越的訊號色。 */
/* 首欄是 sticky 的，底色一定要不透明——半透明會讓橫向捲動時後面的數字透出來，
   跟股票名稱疊在一起（龍頭沒事，是因為它沿用 td.sticky 的實色底）。
   疊一層實色漸層在 surface 上，效果等同半透明但保持不透明。 */
td.sticky.pick{
  box-shadow:inset 3px 0 0 var(--accent);
  background:linear-gradient(rgba(137,169,221,.10),rgba(137,169,221,.10)),var(--surface);
}
tbody tr:hover td.sticky.pick{
  background:linear-gradient(rgba(137,169,221,.16),rgba(137,169,221,.16)),var(--surface-2);
}
td.sticky.pick .c{color:var(--ink);font-weight:700}
td.sticky.lead{box-shadow:inset 2px 0 0 var(--line-strong)}
td.sticky.lead .c,td.sticky.lead .nm{color:var(--ink-3)}

.srclegend{display:flex;gap:16px;align-items:center;margin:0 0 10px;font-size:11.5px}
.srclegend[hidden]{display:none}
.sl{display:flex;align-items:center;gap:6px}
.sl i{display:inline-block;width:3px;height:13px;border-radius:2px}
.sl.pick{color:var(--ink-2);font-weight:500}
.sl.pick i{background:var(--accent)}
.sl.lead{color:var(--ink-3)}
.sl.lead i{background:var(--line-strong);width:2px}
.sl small{color:var(--ink-3);font-weight:400}

.tick{display:flex;flex-direction:column;gap:0;line-height:1.25}
.tick .c{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.01em}
.tick .nm{
  font-size:11.5px;color:var(--ink-3);
  max-width:116px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chip{
  display:inline-block;font-size:11px;color:var(--ink-2);
  background:var(--surface-3);border-radius:5px;padding:2px 7px;white-space:nowrap;
  max-width:104px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;
}
td.slope{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500}
td.sep{border-left:1px solid var(--line)}
thead th.sep{border-left:1px solid var(--line)}
.x{
  display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:20px;border-radius:5px;font-size:12px;font-weight:700;
}
thead th.xc,tbody td.xc{padding-left:4px;padding-right:4px}
/* 營收年增%：正綠負橘，底色深淺隨幅度（40% 封頂） */
td.rev{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500}
.x.up{color:var(--pos);background:rgba(var(--pos-soft),.14)}
.x.dn{color:var(--neg);background:rgba(var(--neg-soft),.15)}
.x.no{color:var(--flat);opacity:.35;font-weight:400}
/* 剛變化：0~1 個交易日內穿的，除了底色最濃，再加一圈同色外框 */
.x.fresh{box-shadow:inset 0 0 0 1.5px currentColor}
td.days{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
td.days.soon{color:var(--warn);font-weight:600;background:var(--warn-soft)}
/* 距 52 週新高幾週：0＝本週創高，越大越久沒創高（分級同圖例） */
td.w52{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
td.w52 span{
  display:inline-block;min-width:26px;padding:2px 6px;border-radius:5px;text-align:center;
}
td.w52.new span{color:var(--pos);background:rgba(var(--pos-soft),.22);font-weight:700}
td.w52.hot span{color:var(--pos);background:rgba(var(--pos-soft),.12)}
td.w52.mid span{color:var(--ink-3);background:var(--surface-3)}
td.w52.cold span{color:var(--neg);background:rgba(var(--neg-soft),.16);font-weight:700}
/* ---------- 自導自演 ---------- */
/* 紙上帳戶的戰情頁：現在的持股與停損停利、資金曲線、交易紀錄、每天那則訊息。
   表格另外開一個 class——追蹤板的 table 規則（最小寬度、釘住的表頭）這裡都不適用。 */
.ap-sec{margin:26px 0 0}
.ap-sec > h2{
  font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.03em;
  margin:0 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
}
.ap-sec > h2 small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.ap-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.ap-scroll{overflow-x:auto;border-radius:var(--r)}
table.ap-t{min-width:0;width:100%}
table.ap-t thead th{position:static;cursor:default;padding:8px 12px}
table.ap-t thead th:hover{color:var(--ink-3)}
table.ap-t tbody td{padding:8px 12px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
table.ap-t td.lt, table.ap-t th.lt{text-align:left}
table.ap-t td.nm{font-family:var(--sans);font-size:13.5px;font-weight:500}
table.ap-t td.nm small{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:6px;font-weight:400}
table.ap-t td.why{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);white-space:normal;min-width:220px;text-align:left}
table.ap-t td small{color:var(--ink-3);font-size:11.5px;margin-left:5px}
.ap-up{color:var(--pos)} .ap-dn{color:var(--warn)} .ap-mute{color:var(--ink-3)}
.ap-tag{
  display:inline-block;font-family:var(--sans);font-size:11.5px;font-weight:500;
  padding:1px 8px;border-radius:99px;border:1px solid var(--line-strong);color:var(--ink-2);
}
.ap-tag.buy{border-color:rgba(var(--pos-soft),.5);color:var(--pos)}
.ap-tag.sell{border-color:rgba(239,116,98,.5);color:var(--warn)}
.ap-tag.trim{border-color:rgba(var(--neg-soft),.5);color:var(--neg)}
.ap-chart{position:relative;padding:14px 14px 6px}
.ap-chart svg{display:block;width:100%;height:auto;overflow:visible}
.ap-chart .grid{stroke:var(--line);stroke-width:1}
.ap-chart .zero{stroke:var(--line-strong);stroke-width:1;stroke-dasharray:3 4}
.ap-chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ap-chart .ar{fill:var(--accent-soft);stroke:none}
.ap-chart .ax{font-family:var(--mono);font-size:10.5px;fill:var(--ink-3)}
.ap-chart .cross{stroke:var(--ink-3);stroke-width:1;visibility:hidden}
.ap-chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2;visibility:hidden}
.ap-tip{
  position:absolute;pointer-events:none;visibility:hidden;z-index:4;white-space:nowrap;
  background:var(--surface-3);border:1px solid var(--line-strong);border-radius:8px;
  padding:6px 10px;font-size:12px;color:var(--ink-2);box-shadow:var(--shadow);
}
.ap-tip b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.ap-chart .bn{fill:none;stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:5 4;stroke-linejoin:round}
.ap-chart .mk{stroke:var(--surface);stroke-width:1.5}
.ap-chart .mk.buy{fill:var(--pos)} .ap-chart .mk.sell{fill:var(--warn)} .ap-chart .mk.both{fill:var(--accent)}
.ap-legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 4px 8px 46px;font-size:11.5px;color:var(--ink-3)}
.ap-legend span{display:inline-flex;align-items:center;gap:6px}
.ap-legend i{display:inline-block}
.ap-legend .l1{width:18px;height:2px;background:var(--accent)}
.ap-legend .l2{width:18px;height:0;border-top:1.5px dashed var(--ink-3)}
.ap-legend .m{width:8px;height:8px;border-radius:50%}
.ap-legend .m.buy{background:var(--pos)} .ap-legend .m.sell{background:var(--warn)}
.ap-tip{line-height:1.6}
.ap-regime{margin:-10px 2px 0;font-size:12.5px;line-height:1.7;color:var(--ink-3)}
.ap-regime b{color:var(--ink-2);font-weight:500;margin-right:8px;letter-spacing:.08em;font-size:11px}
.stat .v.txt{font-family:var(--sans);font-size:17px;font-weight:700;line-height:1.35}
.stat .v.txt small{display:block;margin:2px 0 0}
/* 交易紀錄：成績摘要＋一筆交易一列 */
.ap-kpis{
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;margin:0 0 10px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
}
.ap-kpis[hidden]{display:none}
.kpi{background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:1px}
.kpi .k{font-size:11px;letter-spacing:.09em;color:var(--ink-3)}
.kpi b{font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi small{font-size:11px;color:var(--ink-3)}
.ap-filter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.ap-filter[hidden]{display:none}
.ap-filter .ap-day{font-family:var(--sans)}
.ap-filter .ap-month{margin-left:auto}
table.ap-trips tr.row{cursor:pointer}
table.ap-trips td.nm .ap-chev{margin-right:8px}
table.ap-trips tr.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
table.ap-trips tr.more td{padding:2px 12px 12px 34px;white-space:normal;text-align:left;background:var(--surface-2)}
table.ap-trips tr.more:hover td{background:var(--surface-2)}
.fill{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:5px 0;font-size:12.5px}
.fill + .fill{border-top:1px dashed var(--line)}
.fill .d{color:var(--ink-3);min-width:38px}
.fill .ap-mute{font-family:var(--sans)}
.ap-more{
  display:block;width:100%;appearance:none;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;
  font-family:var(--sans);font-size:13px;color:var(--accent);padding:10px;border-radius:0 0 var(--r) var(--r);
}
.ap-more:hover{background:var(--surface-2)}
.ap-more[hidden]{display:none}
.ap-log > summary{list-style:none;cursor:pointer}
.ap-log > summary::-webkit-details-marker{display:none}
.ap-log > summary h2{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.03em;margin:0 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ap-log > summary h2::before{content:'›';color:var(--ink-3);font-family:var(--sans);transition:transform .15s;display:inline-block}
.ap-log[open] > summary h2::before{transform:rotate(90deg)}
.ap-log > summary h2 small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.ap-log > summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.ap-todo{padding:14px 18px;font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.ap-todo p{margin:0}
.ap-todo p.sub{padding-left:1.6em;color:var(--ink-3);font-size:12.5px}
.ap-todo b{color:var(--ink);font-weight:700}
.ap-days{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.ap-day{
  appearance:none;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--ink-3);
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:4px 10px;
}
.ap-day:hover{color:var(--ink-2);border-color:var(--line-strong)}
.ap-day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.ap-day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ap-msg{padding:16px 18px;font-size:13.5px;line-height:1.8;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.ap-msg b{color:var(--ink);font-weight:700}
.ap-note{font-size:12px;color:var(--ink-3);margin:8px 2px 0}
.ap-pick{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin:0 0 10px}
.ap-pick .ap-days{margin:0;flex:1 1 300px}
.ap-month{
  appearance:none;font-family:var(--mono);font-size:12px;color:var(--ink);cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:7px;padding:4px 10px;
}
.ap-month:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ap-lock{
  max-width:340px;margin:64px auto 0;padding:26px 24px 22px;text-align:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
}
.ap-lock h2{font-family:var(--serif);font-size:18px;margin:0 0 4px}
.ap-lock p{font-size:12.5px;color:var(--ink-3);margin:0 0 16px}
.ap-lock input{
  width:100%;font:inherit;font-size:16px;color:var(--ink);text-align:center;letter-spacing:.06em;
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:9px 12px;
}
.ap-lock input:focus{outline:2px solid var(--accent);outline-offset:1px}
.ap-lock button{
  width:100%;margin-top:10px;font:inherit;font-weight:700;cursor:pointer;
  background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:9px 12px;
}
.ap-lock button:disabled{opacity:.6;cursor:default}
.ap-lock .err{color:var(--warn);margin:12px 0 0}
/* 持股：照 portfolio 表的樣子——留白多、表頭小字大寫字距、配置用圓環、損益帶三角形；
   點一列（或右邊的 ›）展開股數／現價／停損／停利（使用者 2026-11-10 給的參考圖） */
.ap-pf{padding:6px 10px 0}
table.ap-pt{min-width:640px;width:100%;border-collapse:collapse}
table.ap-pt thead th{
  position:static;cursor:default;background:none;border:0;text-align:left;white-space:nowrap;
  padding:16px 14px 12px;font-family:var(--sans);font-size:11.5px;font-weight:500;
  letter-spacing:.14em;color:var(--ink-3);
}
table.ap-pt thead th:hover{color:var(--ink-3)}
table.ap-pt tbody td{
  padding:16px 14px;border:0;text-align:left;white-space:nowrap;
  font-family:var(--sans);font-size:15.5px;font-variant-numeric:tabular-nums;color:var(--ink);
}
table.ap-pt tbody tr.row{cursor:pointer}
table.ap-pt tbody tr.row:hover td{background:var(--surface-2)}
table.ap-pt tbody tr.row td:first-child{border-radius:10px 0 0 10px}
table.ap-pt tbody tr.row td:last-child{border-radius:0 10px 10px 0}
.ap-stk{display:flex;align-items:center;gap:14px}
.ap-logo{
  flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff;letter-spacing:0;
}
.ap-stk b{font-size:16px;font-weight:700;letter-spacing:.02em}
.ap-stk small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.ap-chev{color:var(--ink-3);font-size:17px;transition:transform .15s;display:inline-block}
tr.row[aria-expanded="true"] .ap-chev{transform:rotate(90deg)}
.ap-alloc{display:flex;align-items:center;gap:10px}
.ap-ring{flex:none;width:24px;height:24px;transform:rotate(-90deg)}
.ap-ring circle{fill:none;stroke-width:2.6}
.ap-ring .tr{stroke:var(--line)}
.ap-ring .ar{stroke:var(--ink);stroke-linecap:round}
.ap-tri{font-size:11px;margin-right:4px;position:relative;top:-1px}
table.ap-pt td.ap-up, table.ap-pt td .ap-up{color:var(--pos)}
table.ap-pt td.ap-dn{color:var(--warn)}
table.ap-pt tr.more td{padding:0 14px 14px 58px;font-size:12.5px;color:var(--ink-3);white-space:normal;cursor:default}
table.ap-pt tr.more span{display:inline-block;margin-right:22px}
table.ap-pt tr.more b{font-family:var(--mono);font-weight:500;color:var(--ink-2);margin-left:4px}
.ap-pf-foot{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:14px 14px 18px;
  font-size:12.5px;letter-spacing:.12em;color:var(--ink-3);
}
.ap-pf-foot b{font-size:15px;letter-spacing:.02em;margin-left:8px;font-weight:600;font-variant-numeric:tabular-nums}
.ap-pf-foot i{font-style:normal;opacity:.5}
@media (max-width:760px){
  table.ap-pt thead th, table.ap-pt tbody td{padding:12px 10px}
  table.ap-pt tbody td{font-size:14px}
  table.ap-pt tr.more td{padding-left:10px}
  table.ap-t thead th, table.ap-t tbody td{padding:7px 9px}
  .ap-kpis{grid-template-columns:repeat(2,1fr)}
  .kpi:last-child{grid-column:1/-1}
  .ap-legend{padding-left:4px}
  table.ap-trips tr.more td{padding-left:12px}
  .ap-todo,.ap-msg{padding:12px 13px}
}

/* ---------- 追蹤板升級（2026-11-11）---------- */
/* 名單（經典／BTFD／轉換）：分頁只留市場，名單是第二層 */
.lists{
  display:flex;gap:2px;margin-left:auto;align-self:center;margin-bottom:6px;flex:0 0 auto;
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px;
}
.lbtn{
  appearance:none;border:0;background:none;cursor:pointer;white-space:nowrap;
  font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-3);
  padding:4px 11px;border-radius:6px;display:flex;align-items:center;gap:6px;
}
.lbtn:hover{color:var(--ink-2)}
.lbtn .n{font-family:var(--mono);font-size:10.5px;opacity:.75}
.lbtn[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.lbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 今天有變化：四種「剛發生」的事，點了就只看那幾檔 */
.freshbar{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:-6px 0 16px}
.freshbar[hidden]{display:none}
.freshbar .flab{align-self:center;font-size:11px;letter-spacing:.09em;color:var(--ink-3);margin-right:2px}
.fchip{
  appearance:none;cursor:pointer;text-align:left;font-family:var(--sans);color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 12px;
  display:flex;flex-direction:column;gap:1px;min-width:150px;flex:1 1 150px;max-width:330px;
}
.fchip:hover{border-color:var(--line-strong)}
.fchip .ft{font-size:12.5px;display:flex;align-items:center;gap:7px}
.fchip .ft b{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ink);margin-left:auto}
.fchip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.fchip small{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.fchip:disabled{opacity:.45;cursor:default}
.fchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 族群鈕預設只露一列 */
.groupwrap{display:flex;gap:8px;align-items:flex-start;margin-bottom:18px}
.groupwrap .groups{flex:1;min-width:0;margin-bottom:0}
.groups.fold{max-height:30px;overflow:hidden}
.gmore{
  appearance:none;cursor:pointer;flex:0 0 auto;font-family:var(--sans);font-size:12.5px;white-space:nowrap;
  border:1px solid var(--line-strong);background:var(--surface-2);color:var(--accent);padding:4px 11px;border-radius:20px;
}
.gmore[hidden]{display:none}
.gmore:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.groupwrap + .subs{margin-top:-10px}
#tbody tr{cursor:pointer}
/* 個股側欄 */
.dback{position:fixed;inset:0;z-index:60;background:rgba(5,8,12,.55)}
.drawer{
  position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(400px,100vw);overflow-y:auto;
  background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:-18px 0 40px -20px rgba(0,0,0,.9);
  padding:22px 22px 28px;
}
.dback[hidden],.drawer[hidden]{display:none}
.dclose{
  position:absolute;top:12px;right:14px;appearance:none;border:0;background:none;cursor:pointer;
  color:var(--ink-3);font-size:24px;line-height:1;padding:4px 8px;border-radius:6px;
}
.dclose:hover{color:var(--ink);background:var(--surface-3)}
.dclose:focus-visible{outline:2px solid var(--accent)}
.drawer h3{font-family:var(--serif);font-size:20px;margin:0 30px 2px 0;line-height:1.3}
.drawer h3 small{font-family:var(--mono);font-size:13px;color:var(--ink-3);font-weight:400;margin-left:8px}
.drawer .dtags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 16px}
.drawer h4{font-size:11px;letter-spacing:.1em;color:var(--ink-3);font-weight:500;margin:18px 0 8px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.dgrid div{background:var(--surface-2);padding:9px 12px;display:flex;flex-direction:column;gap:1px}
.dgrid small{font-size:11px;color:var(--ink-3)}
.dgrid b{font-family:var(--mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.dgrid i{font-style:normal;font-size:11px;color:var(--ink-3)}
.dlist{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
.dlist .x{margin-right:8px}
.drep{
  appearance:none;cursor:pointer;width:100%;text-align:left;font-family:var(--sans);font-size:13px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;gap:8px;align-items:center;
}
.drep:hover{border-color:var(--accent)}
.drep small{color:var(--ink-3);margin-left:auto}
.drep:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dnone{font-size:13px;color:var(--ink-3)}
/* 手機：表格換成一檔一張卡 */
.msort{
  display:none;appearance:none;font-family:var(--sans);font-size:13px;color:var(--ink);cursor:pointer;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:7px 11px;
}
.mcards{display:flex;flex-direction:column;gap:8px}
.mcards[hidden]{display:none}
.mcard{
  appearance:none;cursor:pointer;text-align:left;width:100%;font-family:var(--sans);color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;
  display:flex;flex-direction:column;gap:8px;
}
.mcard.pick{box-shadow:inset 3px 0 0 var(--accent)}
.mcard .mh{display:flex;align-items:baseline;gap:8px;min-width:0}
.mcard .mh b{font-family:var(--mono);font-size:14px;font-weight:600}
.mcard .mh .nm{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mcard .mh .chip{margin-left:auto;flex:0 0 auto}
.mcard .mr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mcard .mv{display:flex;flex-direction:column;gap:2px;min-width:0}
.mcard .mv small{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.mcard .mv i{font-style:normal;font-family:var(--mono);font-size:12.5px;font-weight:500;border-radius:5px;padding:2px 6px;text-align:center;background:var(--surface-3);color:var(--ink-2)}
.mcard .mx{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.mcard .mx .x{width:18px;height:18px;margin-right:3px}
.mcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:700px){
  .msort{display:block}
  #tscroll{display:none}
  .fchip{min-width:0;flex:1 1 44%}
  .drawer{width:100vw;border-left:0}
}

/* ---------- 週報升級（2026-11-11）---------- */
.st i{font-style:normal;font-family:var(--sans);font-size:10px;border-radius:3px;padding:0 4px;margin-left:5px}
.st i.nw{color:var(--surface);background:var(--accent);font-weight:700}
.st i.sk{color:var(--ink-3);background:var(--surface-2);font-family:var(--mono)}
.replegend{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.replegend .st{padding:1px 2px 1px 0;background:none}
.rephero{
  display:block;width:100%;text-align:left;appearance:none;cursor:pointer;font-family:var(--sans);color:var(--ink);
  background:linear-gradient(rgba(137,169,221,.07),rgba(137,169,221,.07)),var(--surface);
  border:1px solid var(--line-strong);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px;
}
.rephero:hover{border-color:var(--accent)}
.rephero:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rephero .hk{font-size:11px;letter-spacing:.12em;color:var(--accent)}
.rephero .ht{font-family:var(--serif);font-size:21px;font-weight:700;margin:2px 0 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rephero .ht small{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--accent)}
.rephero .hf{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--ink-3);margin-bottom:12px}
.rephero .hf b{font-family:var(--mono);font-weight:500;color:var(--ink);margin-right:4px;font-size:14px}
.rephero .rs{display:flex;flex-wrap:wrap;gap:5px 6px}
.rephero .st{font-size:12.5px;padding:2px 8px}
.tl{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:13px 16px;margin-bottom:10px;
}
.tl .tlh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:9px;font-size:14px}
.tl .tlh b{font-family:var(--mono);font-weight:600}
.tl .tlh small{font-size:12px;color:var(--ink-3)}
.tl .tld{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tl .dot{width:7px;height:7px;border-radius:50%;background:var(--surface-3);margin:0 3px}
.tl .hitb{
  appearance:none;cursor:pointer;border:0;font-family:var(--mono);font-size:11.5px;
  color:var(--surface);background:var(--accent);border-radius:5px;padding:2px 8px;font-weight:600;
}
.tl .hitb.hot{background:var(--neg)} .tl .hitb.clown{background:var(--ink-3)}
.tl .hitb:hover{filter:brightness(1.15)}
.tl .hitb:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.repnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.repnav .backlink{margin-bottom:0}
.repnav .backlink[hidden]{display:none}
.reptitle{font-family:var(--serif);font-size:16px;font-weight:700;margin:0 auto;padding:0 8px}
.reptoc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

/* 週報：用 iframe 隔離渲染。週報自己的 CSS 也用 .top / .wrap，
   直接注進頁面會跟追蹤板的樣式互相覆蓋。 */
.repcard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;margin-top:2px;
}
#repframe{display:block;width:100%;border:0;min-height:420px;background:var(--surface)}

/* 週報清單：一期一列，左邊期別、中間該期入選個股、右邊日期 */
.replist{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
}
.reprow{
  display:grid;grid-template-columns:minmax(152px,auto) 1fr auto;
  gap:6px 16px;align-items:baseline;width:100%;text-align:left;
  appearance:none;border:0;border-bottom:1px solid var(--line);background:none;
  color:var(--ink);font-family:var(--sans);cursor:pointer;padding:12px 16px;
}
.reprow:last-child{border-bottom:0}
.reprow:hover{background:var(--surface-2)}
.reprow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.reprow .rt{font-size:14px;font-weight:500;white-space:nowrap}
.reprow .rs{display:flex;flex-wrap:wrap;gap:4px 5px;min-width:0}
.reprow .rd{
  font-family:var(--mono);font-size:12px;color:var(--ink-3);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.st{
  font-size:11.5px;color:var(--ink-2);background:var(--surface-3);
  border-radius:5px;padding:1px 7px;white-space:nowrap;
}
.st b{font-family:var(--mono);font-weight:500;color:var(--ink-3);margin-right:4px}
.st.hot{color:var(--neg);background:rgba(var(--neg-soft),.13)}
.st.hot b{color:var(--neg);opacity:.75}
.st.clown{color:var(--ink-3)}
.st mark{background:rgba(137,169,221,.30);color:var(--ink);border-radius:2px;padding:0 1px}
.repcount{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-left:auto}
.backlink{
  appearance:none;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink-2);font-family:var(--sans);font-size:13px;cursor:pointer;
  padding:6px 13px;border-radius:8px;margin-bottom:12px;
}
.backlink:hover{border-color:var(--ink-3);color:var(--ink)}
.backlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:700px){
  /* 窄螢幕改成兩行：第一行期別＋日期，個股整排移到第二行。
     三個子元素在兩欄網格裡若靠自動排版，日期會被擠掉，所以明確指定格位。 */
  .reprow{grid-template-columns:1fr auto}
  .reprow .rt{grid-area:1/1/2/2}
  .reprow .rd{grid-area:1/2/2/3}
  .reprow .rs{grid-area:2/1/3/3}
}
.empty{padding:56px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.empty .big{font-family:var(--serif);font-size:17px;color:var(--ink-2);display:block;margin-bottom:6px}

/* 手機與平板 */
@media (max-width:1160px){
  /* 六個分頁在窄螢幕一定排不下，改成可橫向滑動的一條；
     負邊距讓它從螢幕左緣捲到右緣，不會卡在內距裡。 */
  .tabs{
    overflow-x:auto;overflow-y:hidden;
    margin:0 calc(-1 * var(--pad));padding:0 var(--pad);
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 12px 11px}
  /* 市場只剩三個分頁，排得下；名單那組鈕排不下時自己掉到第二行，不要藏在右邊要捲才看得到 */
  .tabs{flex-wrap:wrap;overflow:visible}
  .lists{margin:4px auto 8px 0}

  /* 表格自己變成雙向捲動容器，表頭與首欄才有東西可以「黏」——
     沒有高度上限時 sticky 是無效的，因為容器根本不會垂直捲動。 */
  .tscroll{
    overflow:auto;
    max-height:calc(100vh - 24px);
    max-height:calc(100dvh - 24px);
  }
  thead tr:first-child th{top:0}
  thead tr:nth-child(2) th{top:var(--hrow-h,24px)}
  /* 頁面 header 若還是 sticky，會蓋住剛剛釘好的表頭 */
  .top{position:static}
}
@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:last-child{grid-column:1/-1}
  .brand h1{font-size:20px}
  .search{flex:1 1 100%}
  .wrap{padding:0 14px 56px}
  .top-in{--pad:14px;padding:14px var(--pad) 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="gate" id="gate">
  <form class="lock" id="lockform" autocomplete="off">
    <div class="mark">小論文經典</div>
    <p class="hint">私人追蹤名單，輸入密碼查看</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="密碼" aria-label="密碼">
    <button type="submit" id="unlock">進入</button>
    <p class="err" id="lockerr" hidden></p>
    <p class="foot-note">資料以密碼加密存放</p>
  </form>
</div>

<div id="app" hidden>
<header class="top">
  <div class="top-in">
    <div class="brand">

        <button class="mode" role="tab" data-mode="board" aria-selected="true">追蹤板</button>
        <button class="mode" role="tab" data-mode="report" aria-selected="false">週報</button>
        <button class="mode" role="tab" data-mode="auto" aria-selected="false" id="modeAuto" hidden>自導自演</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<div class="wrap">
  <div id="boardView">
  <div class="trail" id="trail" hidden>
    <span class="tlab" id="traillabel">週報提過</span>
    <div class="trail-clip" id="trailclip"><div class="trail-track" id="trailtrack"></div></div>
    <span class="tfade"></span>
  </div>
  <section class="stats" id="stats"></section>
  <div class="freshbar" id="fresh" hidden></div>

  <div class="controls">
    <label class="search">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input id="q" type="search" placeholder="搜尋代號、名稱或族群" autocomplete="off">

    <span id="maToggles">

      <button class="toggle" id="tUp" aria-pressed="false"><span class="dot" style="color:var(--pos)"></span>近10日有上穿</button>
      <button class="toggle" id="tDn" aria-pressed="false"><span class="dot" style="color:var(--neg)"></span>近10日有下穿</button>

  <div class="mcards" id="mcards" hidden></div>
  <div class="tablecard" id="tablecard">

        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden></div>
  </div>
  </div>

  <div id="autoView" hidden>
    <form class="ap-lock" id="apLock" autocomplete="off" hidden>
      <h2>自導自演</h2>

          <table class="ap-pt" id="apPos"></table>

        <div class="ap-pf-foot" id="apPosFoot"></div></div>
      </div>

        <div class="ap-card ap-chart" id="apChart"></div>
      </div>

      <div class="ap-sec">
        <h2>交易紀錄 <small id="apEvSub"></small></h2>
        <div class="ap-kpis" id="apKpis"></div>
        <div class="ap-filter" id="apTripFilter"></div>
        <div class="ap-card"><div class="ap-scroll">
          <table class="ap-t ap-trips" id="apEv"></table>
        </div>
        <button class="ap-more" id="apTripMore" hidden></button></div>
        <p class="ap-note" id="apEvNote" hidden>標「補」的是當天訊息沒有列出成交、依持股第一次出現那天補記的買進。</p>
      </div>

      <details class="ap-sec ap-log" id="apLog">
        <summary><h2>每日紀錄 <small>當晚發到 Telegram 的那一則　·　點一下展開</small></h2></summary>
        <div class="ap-pick">
          <select class="ap-month" id="apMonth" aria-label="月份"></select>
          <div class="ap-days" id="apDays"></div>
        </div>
        <div class="ap-card ap-msg" id="apMsg"></div>
      </details>
    </div>
  </div>

  <div id="reportView" hidden>
    <div id="repList">
      <div class="controls">
        <label class="search">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
          <input id="repq" type="search" placeholder="搜尋期別或個股" autocomplete="off">
        </label>
        <span class="replegend"><span class="st"><i class="nw">新</i></span>這一期才出現　<span class="st"><i class="sk">連3</i></span>連續幾期都入選</span>
        <span class="repcount" id="repcount"></span>
      </div>
      <div id="reptimeline" hidden></div>
      <div id="rephero" hidden></div>
      <div class="replist" id="replist"></div>
      <div class="empty" id="repempty" hidden></div>
    </div>
    <div id="repDoc" hidden>
      <div class="repnav">
        <button class="backlink" id="repback">← 全部週報</button>
        <button class="backlink" id="repprev" hidden></button>
        <span class="reptitle" id="reptitle"></span>
        <button class="backlink" id="repnext" hidden></button>
      </div>
      <div class="reptoc" id="reptoc"></div>
      <div class="repcard" id="repcard">
        <iframe id="repframe" title="選股週報"
                sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
      </div>
    </div>
  </div>

</div>
<div class="dback" id="dback" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="個股資訊">
  <button class="dclose" id="dclose" aria-label="關閉">×</button>
  <div id="dbody"></div>
</aside>

<script>
(function(){
  const ENV  = JSON.parse(document.getElementById('payload').textContent);
  const gate = document.getElementById('gate');
  const app  = document.getElementById('app');
  const form = document.getElementById('lockform');
  const pwin = document.getElementById('pw');
  const btn  = document.getElementById('unlock');
  const errp = document.getElementById('lockerr');
  const STORE = 'littleessay.pw';

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  function fail(msg){
    btn.disabled = false; btn.textContent = '進入';
    errp.textContent = msg; errp.hidden = false;
  }

  let KEY = null;   // 看板與週報共用同一組 salt，所以只導一次

  async function decrypt(pw){
    const km = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(ENV.salt), iterations:ENV.iters, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:b64(ENV.iv)}, key, b64(ENV.ct));
    KEY = key;
    return JSON.parse(new TextDecoder().decode(pt));
  }

  /* 週報各自是一個密文檔，點到才抓才解——全部塞進首頁的話，
     一年三個市場累積下來會變成好幾 MB 的單一檔案。 */
  const repCache = new Map();
  async function fetchReport(file){
    if(repCache.has(file)) return repCache.get(file);
    const res = await fetch('r/' + file, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const env = await res.json();
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(env.iv)}, KEY, b64(env.ct));
    const html = new TextDecoder().decode(pt);
    repCache.set(file, html);
    return html;
  }

  async function tryUnlock(pw, remember){
    btn.disabled = true; btn.textContent = '解鎖中…'; errp.hidden = true;
    try{
      const data = await decrypt(pw);
      if(remember){ try{ localStorage.setItem(STORE, pw); }catch(e){} }
      gate.remove(); app.hidden = false;
      boot(data);
      return true;
    }catch(e){
      try{ localStorage.removeItem(STORE); }catch(_){}
      pwin.value = ''; pwin.focus();
      fail('密碼不對，再試一次');
      return false;
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = pwin.value.trim();
    if(v) tryUnlock(v, true);
  });

  (async function(){
    if(!(window.crypto && crypto.subtle)){
      pwin.disabled = true;
      fail('這個瀏覽器無法解密；請用 https 網址開啟');
      btn.disabled = true;
      return;
    }
    let saved = null;
    try{ saved = localStorage.getItem(STORE); }catch(e){}
    if(saved){
      btn.disabled = true; btn.textContent = '解鎖中…';
      const ok = await tryUnlock(saved, false);
      if(!ok) errp.hidden = true;
    } else {
      pwin.focus();
    }
  })();

  function boot(DATA){

  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  document.getElementById('gen').textContent = DATA.generated;
  /* header row 2 */
  /* 兩個視圖共用同一張表，只換表頭與表身。個股與族群固定不動。 */

    </tr>
    <tr id="hrow"></tr>`;

  const STAGE_SUBS = [
    {k:'s1p', label:'S1', cls:'sep'}, {k:'s3p', label:'S3'}, {k:'s3hp', label:'S3高'}, {k:'s2p', label:'S2高'},
    {k:'s1v', label:'S1', cls:'sep'}, {k:'s3v', label:'S3'}, {k:'s3hv', label:'S3高'}, {k:'s2v', label:'S2高'},
    {k:'pw1', label:'S1', cls:'sep'}, {k:'pw3', label:'S3'},
    {k:'ws10', label:'10', cls:'sep'}, {k:'ws30', label:'30'}
  ];

  const hcell = (o, cls) =>
    `<th class="${cls}${SEP[o.k]?' sep':''}" data-sort="${o.k}">${o.label}<span class="ar">▼</span></th>`;
  function renderHead(){
    $('#thead').innerHTML = state.view === 'stage' ? STAGE_HEAD : MA_HEAD;
    $('#hrow').innerHTML = state.view === 'stage'
      ? STAGE_SUBS.map(o => hcell(o, o.cls || '')).join('')
      : SLOPES.map(o=>hcell(o,'')).join('')
        + CROSS.map(o=>hcell(o,'xc')).join('')
        + REV.map(o=>hcell(o,'')).join('');
    /* 表頭是重建的，排序監聽要跟著重綁 */
    document.querySelectorAll('#thead th[data-sort]').forEach(th => {
      if(th.dataset.sort === state.sort){
        th.setAttribute('data-dir', state.dir);
        const a = th.querySelector('.ar');
        if(a) a.textContent = state.dir < 0 ? '▼' : '▲';
      }
      th.addEventListener('click', () => {
        const k = th.dataset.sort;
        state.dir = (state.sort === k) ? -state.dir : -1;
        state.sort = k;
        renderHead(); render();
      });
    });
  }

  const REPORTS = DATA.reports || [];
  const repMarkets = DATA.order.filter(m => REPORTS.some(r => r.market === m));

  const AP = DATA.autopilot && DATA.autopilot.markets && DATA.autopilot.markets.length ? DATA.autopilot : null;
  const apMarkets = AP ? AP.markets.map(m => m.key) : [];

  /* 追蹤板的分頁只列市場；同一個市場底下的名單（經典／BTFD／轉換）是右邊那組鈕。
     八個分頁擠一排、手機要橫向捲才看得到後面的（使用者 2026-11-11）。 */
  const baseOf = k => k.split('-')[0];
  const kindOf = k => k.includes('-') ? k.slice(k.indexOf('-') + 1) : '經典';
  function renderTabs(){
    if(state.mode === 'board'){
      const bases = [...new Set(DATA.order.map(baseOf))];
      const cur = baseOf(state.mkt), kind = kindOf(state.mkt);
      const pick = b => { const want = kind === '經典' ? b : b + '-' + kind;
                          return DATA.order.includes(want) ? want : DATA.order.find(k => baseOf(k) === b); };
      const lists = DATA.order.filter(k => baseOf(k) === cur);
      const total = b => DATA.order.filter(k => baseOf(k) === b).reduce((n, k) => n + DATA.markets[k].rows.length, 0);
      $('#tabs').innerHTML = bases.map(b =>
        `<button class="tab" role="tab" data-m="${esc(pick(b))}" aria-selected="${b === cur}"
          >${esc((DATA.markets[b] || DATA.markets[pick(b)]).label)}<span class="n">${total(b)}</span></button>`).join('')
        + (lists.length > 1 ? '<span class="lists" role="group" aria-label="名單">' + lists.map(k =>
          `<button class="lbtn" data-m="${esc(k)}" aria-pressed="${k === state.mkt}">${esc(kindOf(k))}<span class="n">${DATA.markets[k].rows.length}</span></button>`).join('') + '</span>' : '');
      return;
    }
    const list = state.mode === 'auto' ? apMarkets : repMarkets;
    $('#tabs').innerHTML = list.map(m => {
      const n = state.mode === 'auto'
        ? AP.markets.find(x => x.key === m).days
        : REPORTS.filter(r => r.market === m).length;
      return `<button class="tab" role="tab" data-m="${m}" aria-selected="${m===state.mkt}"
        >${DATA.markets[m].label}<span class="n">${n}</span></button>`;
    }).join('');
  }

  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab,.lbtn'); if(!b) return;
    state.mkt = b.dataset.m;
    renderTabs();
    if(state.mode === 'board'){
      state.theme = null; state.group = null; state.sort='group'; state.dir=1; state.fresh = null; $('#msort').value = 'group:1';
      syncViewAvail();
      renderHead(); renderToggles(); render(); renderTrail();
    } else if(state.mode === 'auto'){
      state.apDay = null; state.apMonth = null; state.apTrip = {f:'all', m:'', all:false}; showAutopilot();
    } else {
      state.rep = null; showReports();
    }
    syncOffsets(); writeHash();
  });

  /* ---------- 模式切換 ---------- */
  if(REPORTS.length || AP) $('#modes').hidden = false;
  if(AP) $('#modeAuto').hidden = false;

  $('#modes').addEventListener('click', e => {
    const b = e.target.closest('.mode'); if(!b) return;
    setMode(b.dataset.mode);
  });

  /* 網址記住現在在哪：#board/TW-BTFD、#auto/US、#report/TW/2026-11-06/2330。
     重新整理不會跳回追蹤板，TG 訊息也能直接連到某一頁（使用者 2026-11-11）。 */
  function writeHash(push){
    const rep = state.mode === 'report' && state.rep ? REPORTS.find(r => r.file === state.rep) : null;
    const parts = state.mode === 'report' ? ['report', state.mkt].concat(rep ? [rep.date] : [])
                : [state.mode === 'auto' ? 'auto' : 'board', state.mkt];
    const h = '#' + parts.map(encodeURIComponent).join('/');
    if(location.hash === h) return;
    try{ history[push ? 'pushState' : 'replaceState'](null, '', h); }catch(e){}
  }
  function readHash(){
    let p = [];
    try{ p = location.hash.replace(/^#/, '').split('/').map(decodeURIComponent); }catch(e){}
    closeDrawer();
    if(p[0] === 'report' && REPORTS.length){
      const mk = repMarkets.includes(p[1]) ? p[1] : repMarkets[0];
      const r = p[2] ? REPORTS.find(x => x.market === mk && x.date === p[2]) : null;
      state.mkt = mk; state.rep = r ? r.file : null;
      pendingCode = r && p[3] ? p[3] : null;
      setMode('report', true);
    } else if(p[0] === 'auto' && AP){
      if(apMarkets.includes(p[1])) state.mkt = p[1];
      setMode('auto', true);
    } else {
      if(DATA.order.includes(p[1])) state.mkt = p[1];
      else if(!DATA.order.includes(state.mkt)) state.mkt = DATA.order[0];
      state.theme = null; state.group = null; state.fresh = null;
      setMode('board', true);
    }
  }
  window.addEventListener('popstate', readHash);

  function setMode(mode, quiet){
    if(mode === 'report' && !REPORTS.length) return;
    if(mode === 'auto' && !AP) return;
    state.mode = mode;
    document.querySelectorAll('.mode').forEach(m =>
      m.setAttribute('aria-selected', m.dataset.mode === mode));
    $('#boardView').hidden  = mode !== 'board';
    $('#reportView').hidden = mode !== 'report';
    $('#autoView').hidden   = mode !== 'auto';
    if(mode === 'auto'){
      if(!apMarkets.includes(state.mkt)) state.mkt = apMarkets[0];
      state.apDay = null;
      renderTabs(); showAutopilot(); stopTrail();
    } else if(mode === 'report'){
      if(!repMarkets.includes(state.mkt)) state.mkt = repMarkets[0];
      renderTabs(); showReports(); stopTrail();
    } else {
      /* 從週報／自導自演回來時 state.mkt 可能已經被換成別的市場，表頭與快篩要跟著重畫 */
      if(!DATA.order.includes(state.mkt)) state.mkt = DATA.order[0];
      syncViewAvail(); renderHead(); renderToggles();
      renderTabs(); render(); renderTrail();
    }
    syncOffsets();
    if(!quiet) writeHash();
  }

  /* ---------- 自導自演 ---------- */
  /* 紙上帳戶每天一筆存檔（autopilot_log.py 拆 TG 訊息存的）。整份是一個密文檔，點到這個分頁才抓才解。 */
  /* 這個分頁有自己的密碼：自己的 salt、自己的金鑰（AP_KEY），跟網站那把無關。
     解得開 ap/data.json 就是密碼對了（AES-GCM 解錯會直接丟例外）。 */
  const AP_STORE = 'littleessay.appw';
  let AP_KEY = null;
  const apFiles = new Map();           // 檔名 → Promise<內容>；每個月的訊息各自一個檔，看到才抓
  async function apDeriveKey(pw){
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(AP.salt), iterations:AP.iters, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  }
  async function apOpen(file, key){
    const res = await fetch('ap/' + file, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const env = await res.json();
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(env.iv)}, key, b64(env.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function apFile(file){
    if(!apFiles.has(file)){
      apFiles.set(file, apOpen(file, AP_KEY).catch(e => { apFiles.delete(file); throw e; }));
    }
    return apFiles.get(file);
  }
  const fetchAutopilot = () => apFile(AP.file);
  /* 回傳 true＝解開了；false＝密碼不對；丟例外＝檔案抓不到（不是密碼的問題，別把存著的密碼清掉） */
  async function apUnlock(pw, remember){
    const key = await apDeriveKey(pw);
    let res;
    try{ res = await fetch('ap/' + AP.file, {cache:'no-cache'}); }catch(e){ throw new Error('連不上'); }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const env = await res.json();
    let doc;
    try{
      const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(env.iv)}, key, b64(env.ct));
      doc = JSON.parse(new TextDecoder().decode(pt));
    }catch(e){
      try{ localStorage.removeItem(AP_STORE); }catch(_){}
      return false;
    }
    AP_KEY = key;
    apFiles.set(AP.file, Promise.resolve(doc));
    if(remember){ try{ localStorage.setItem(AP_STORE, pw); }catch(e){} }
    return true;
  }
  $('#apLock').addEventListener('submit', async e => {
    e.preventDefault();
    const inp = $('#apPw'), btn2 = $('#apUnlock'), err = $('#apLockErr');
    const v = inp.value.trim(); if(!v) return;
    btn2.disabled = true; btn2.textContent = '解鎖中…'; err.hidden = true;
    let ok = false, msg = '密碼不對，再試一次';
    try{ ok = await apUnlock(v, true); }catch(ex){ msg = '資料讀不到（' + (ex.message || ex) + '），晚點再試'; }
    btn2.disabled = false; btn2.textContent = '解鎖';
    if(ok){ inp.value = ''; showAutopilot(); }
    else { err.textContent = msg; err.hidden = false; inp.value = ''; inp.focus(); }
  });

  const apNum = (v, d) => v == null ? '—' : Number(v).toLocaleString('en-US', {minimumFractionDigits:d||0, maximumFractionDigits:d==null?2:d});
  const apSign = (v, d) => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + apNum(Math.abs(v), d);
  const apCls = v => v == null || v === 0 ? 'ap-mute' : v > 0 ? 'ap-up' : 'ap-dn';
  const apMD = d => d ? (+d.slice(5,7)) + '/' + (+d.slice(8,10)) : '';
  /* 訊息是 TG 的 HTML：只有 <b> 一種標籤，其餘字元已經跳脫過。先還原、整段重新跳脫，再只放行粗體。 */
  function apRich(line){
    const raw = line.replace(/<b>/g, '\u0001').replace(/<\/b>/g, '\u0002')
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
    return esc(raw).replace(/\u0001/g, '<b>').replace(/\u0002/g, '</b>');
  }

  async function showAutopilot(){
    const body = $('#apBody'), empty = $('#apEmpty'), lock = $('#apLock');
    let all;
    if(!AP_KEY){
      body.hidden = true; empty.hidden = true;
      let saved = null;
      try{ saved = localStorage.getItem(AP_STORE); }catch(e){}
      let ok = false;
      if(saved){
        empty.hidden = false; empty.textContent = '解鎖中…';
        try{ ok = await apUnlock(saved, false); }catch(e){}
        empty.hidden = true;
      }
      if(!ok){
        if(state.mode === 'auto'){ lock.hidden = false; $('#apPw').focus(); }
        return;
      }
    }
    lock.hidden = true;
    try{
      if(!apFiles.has(AP.file)){ body.hidden = true; empty.hidden = false; empty.textContent = '讀取中…'; }
      all = await fetchAutopilot();
    }catch(e){
      body.hidden = true; empty.hidden = false;
      empty.innerHTML = '<span class="big">自導自演的資料讀不到</span>' + esc(e.message || e);
      return;
    }
    if(state.mode !== 'auto') return;
    const mk = all[state.mkt];
    if(!mk || !Object.keys(mk.days || {}).length){
      body.hidden = true; empty.hidden = false;
      empty.innerHTML = '<span class="big">這個市場還沒有紀錄</span>';
      return;
    }
    empty.hidden = true; body.hidden = false;
    const cur = state.mkt === 'US' ? '美元' : '元';
    const dates = Object.keys(mk.days).sort();
    const last = mk.days[dates[dates.length - 1]];
    const prev = dates.length > 1 ? mk.days[dates[dates.length - 2]] : null;
    const events = mk.events || [];

    /* --- 頂上五格 --- */
    const dayChg = prev ? last.equity - prev.equity : null;
    $('#apNotice').textContent = mk.notice || '';
    $('#apNotice').hidden = !mk.notice;
    $('#apStats').innerHTML = [
      ['總值', apNum(last.equity, 0), cur + '（' + apSign(last.ret, 2) + '%）', apCls(last.ret)],
      ['比前一天', apSign(dayChg, 0), cur, apCls(dayChg)],
      ['現金', apNum(last.cash, 0), last.equity ? Math.round(last.cash / last.equity * 100) + '%' : '', ''],
      ['已實現／未實現', apSign(last.realized, 0) + ' ／ ' + apSign(last.unreal, 0), cur, ''],
      /* 新版訊息不再寫「盤勢：xx」那一行，內容改在括號那句（note）；格子裡放第一句，整句放在格子下面 */
      ['盤勢', esc(last.regime || (last.note || '').split('、')[0] || '—'),
       last.slots != null ? '持有 ' + last.positions.length + '／最多 ' + last.slots + ' 檔' : '持有 ' + last.positions.length + ' 檔', 'txt'],
    ].map(x => `<div class="stat"><span class="k">${x[0]}</span><span class="v ${x[3]}">${x[1]}<small>${x[2]}</small></span></div>`).join('');
    $('#apRegime').hidden = !last.note;
    $('#apRegime').innerHTML = last.note ? '<b>盤勢</b>' + esc(last.note) : '';

    /* --- 資金曲線：帳戶一條實線、大盤一條虛線（同一天起算的報酬率 %），線上的點是有成交的日子 --- */
    const bench = mk.bench && mk.bench.ret ? mk.bench : null;
    const lastB = bench ? bench.ret[last.date] : null;
    $('#apChartSub').innerHTML = esc(apMD(dates[0]) + ' 起，' + dates.length + ' 個交易日　·　資料至 ' + apMD(last.date) + ' 收盤')
      + (lastB != null ? '　·　<span class="' + apCls(last.ret - lastB) + '">' + (last.ret >= lastB ? '贏' : '輸') + esc(bench.label) + ' '
         + apNum(Math.abs(last.ret - lastB), 2) + ' 個百分點</span>' : '');
    apChart(dates.map(d => mk.days[d]), cur, bench, events);

    /* --- 持股 --- */
    $('#apPosSub').textContent = last.positions.length ? last.positions.length + ' 檔，' + apMD(last.date) + ' 收盤' : '';
    const money = (v, d) => v == null ? '—' : (cur === '美元' ? '$' : '') + apNum(v, d);
    const tri = v => v > 0 ? '<span class="ap-tri">▲</span>' : v < 0 ? '<span class="ap-tri">▼</span>' : '';
    const hue = s => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
    const ring = f => { const C = 2 * Math.PI * 10, a = Math.max(0, Math.min(1, f || 0)) * C;
      return `<svg class="ap-ring" viewBox="0 0 24 24" aria-hidden="true"><circle class="tr" cx="12" cy="12" r="10"/>`
        + (a > 0 ? `<circle class="ar" cx="12" cy="12" r="10" stroke-dasharray="${a.toFixed(2)} ${C.toFixed(2)}"/>` : '') + '</svg>'; };
    const distPct = (px, now) => px && now ? '（' + apSign((px / now - 1) * 100, 1) + '%）' : '';
    $('#apPos').innerHTML = last.positions.length ? `<thead><tr>
        <th>股票</th><th>配置</th><th>損益</th><th>損益 %</th><th>成本</th><th>市值</th><th>均價</th>
      </tr></thead><tbody>` + last.positions.map((p, i) => {
        const cost = p.shares != null && p.avg != null ? p.shares * p.avg : null;
        const alloc = last.equity ? (p.mv || 0) / last.equity : 0;
        const tw = state.mkt !== 'US';
        p = Object.assign({}, p, {name: String(p.name || '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')});  // 存檔裡的名稱是 TG HTML 跳脫過的
        return `<tr class="row" data-i="${i}" aria-expanded="false" tabindex="0">
        <td><div class="ap-stk"><span class="ap-logo" style="background:hsl(${hue(p.code)} 55% 45%)">${esc((tw ? p.name : p.code).slice(0, tw ? 1 : 2))}</span>
          <div><b>${esc(tw ? p.name : p.code)}</b><small>${esc(tw ? p.code : p.name)}</small></div><span class="ap-chev">›</span></div></td>
        <td><div class="ap-alloc">${ring(alloc)}${apNum(alloc * 100, 1)}%</div></td>
        <td class="${apCls(p.pnl)}">${tri(p.pnl)}${money(Math.abs(p.pnl || 0), 0)}</td>
        <td class="${apCls(p.pct)}">${apSign(p.pct, 1)}%</td>
        <td>${money(cost, 0)}</td>
        <td>${money(p.mv, 0)}</td>
        <td>${money(p.avg, 2)}</td></tr>
        <tr class="more" data-for="${i}" hidden><td colspan="7">
          <span>股數<b>${apNum(p.shares, 0)}</b></span><span>現價<b>${money(p.now, 2)}</b></span>
          <span>停損<b>${p.stop ? money(p.stop, 2) + distPct(p.stop, p.now) : '—'}</b></span>
          <span>停利<b>${p.tp ? money(p.tp, 2) + distPct(p.tp, p.now) : '—'}</b></span></td></tr>`; }).join('') + '</tbody>'
      : '<tbody><tr><td class="ap-mute">目前空手</td></tr></tbody>';
    const totPnl = (last.realized || 0) + (last.unreal || 0);
    $('#apPosFoot').innerHTML = `總損益<b class="${apCls(totPnl)}">${totPnl < 0 ? '−' : ''}${money(Math.abs(totPnl), 0)}</b>`
      + `<i>·</i>可用現金<b class="${last.cash > 0 ? 'ap-up' : 'ap-mute'}">${money(last.cash, 0)}</b>`
      + `<i>·</i>總值<b>${money(last.equity, 0)}</b>`;

    apTripData = {trips: apTrips(events, last), cur};
    renderTrips();

    /* --- 接下來要做的事：最新那則訊息的第一段 --- */
    const stamp = state.mkt;                      // 等訊息檔的時候使用者可能已經切到別的市場
    const msgOf = async d => {
      try{ return ((await apFile(d.slice(0, 7) + '.json'))[stamp] || {})[d] || ''; }catch(e){ return null; }
    };
    const lastMsg = await msgOf(last.date);
    if(state.mode !== 'auto' || state.mkt !== stamp) return;
    const lines = (lastMsg || '').split('\n');
    const a = lines.findIndex(l => /【.*要做的事】/.test(l));
    let todo = [];
    if(a >= 0){
      for(let i = a + 1; i < lines.length && !/^<b>【/.test(lines[i]); i++) if(lines[i].trim()) todo.push(lines[i]);
    }
    $('#apTodoHead').innerHTML = (a >= 0 ? apRich(lines[a]).replace(/<\/?b>|[【】]/g, '') : '接下來要做的事')
      + ' <small>' + apMD(last.date) + ' 收盤後決定的</small>';
    $('#apTodo').innerHTML = todo.length
      ? todo.map(l => `<p class="${/^\s{2,}/.test(l) ? 'sub' : ''}">${apRich(l.trim())}</p>`).join('')
      : '<p class="ap-mute">沒有要做的事。</p>';

    /* --- 每日紀錄：預設收合，展開才去抓那個月的訊息檔 --- */
    /* 一次只列一個月的日期，訊息也是一個月一個檔——紀錄再多年，畫面和下載量都只有一個月的份 */
    const months = Array.from(new Set(dates.map(d => d.slice(0, 7)))).filter(m => (AP.months || []).includes(m)).reverse();
    if(!state.apMonth || !months.includes(state.apMonth)) state.apMonth = months[0];
    $('#apMonth').innerHTML = months.map(m =>
      `<option value="${m}"${m === state.apMonth ? ' selected' : ''}>${m.slice(0, 4)} 年 ${+m.slice(5)} 月</option>`).join('');
    $('#apMonth').hidden = months.length < 2;
    if($('#apLog').open) await apDayLog(stamp);
  }

  /* --- 交易紀錄：一筆交易一列（買進到全部賣完算一筆），點開才看每一次成交 ---
     原本一次成交一列，分批賣的一檔會拆成四五列，而且只會越來越長（使用者 2026-11-11）。 */
  const unent = s => String(s || '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  const apMoney = (v, d, cur) => v == null ? '—' : (cur === '美元' ? '$' : '') + apNum(v, d);
  const dayGap = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
  let apTripData = {trips:[], cur:'元'};
  function apTrips(events, last){
    const open = new Map(), trips = [];
    const start = e => { const t = {code:e.code, name:unent(e.name), in:null, out:null, fills:[], bought:0, cost:0, left:0,
                                    pnl:0, risk:0, sells:0, why:'', kind:'', src:false, closed:false};
                         open.set(e.code, t); trips.push(t); return t; };
    for(const e of events){
      let t = open.get(e.code) || start(e);
      t.fills.push(e);
      const n = e.shares || 0;
      if(e.kind === '買進'){
        if(!t.in) t.in = e.date;
        t.bought += n; t.left += n; t.cost += n * (e.price || 0);
        if(e.stop != null && e.price != null) t.risk += (e.price - e.stop) * n;
        if(e.src) t.src = true;
      } else {
        t.left -= n; t.pnl += e.pnl || 0; t.sells++; t.out = e.date; t.why = e.why || ''; t.kind = e.kind; t.lastR = e.r;
        if(t.left <= t.bought * 0.005 + 1e-6){ t.closed = true; open.delete(e.code); }
      }
    }
    const held = new Map((last.positions || []).map(p => [p.code, p]));
    for(const t of open.values()){
      const p = held.get(t.code);
      if(p){ t.unreal = p.pnl || 0; } else { t.closed = true; }      // 帳上已經沒有這檔：當作結束了
    }
    for(const t of trips){
      const tot = t.pnl + (t.closed ? 0 : (t.unreal || 0));
      t.total = tot;
      t.r = t.risk > 0 ? tot / t.risk : (t.closed && t.lastR != null ? t.lastR : null);
      t.pct = t.cost > 0 ? tot / t.cost * 100 : null;
      t.days = t.in ? dayGap(t.in, t.closed ? t.out : last.date) : null;
      t.month = ((t.closed ? t.out : last.date) || '').slice(0, 7);
    }
    return trips.reverse();
  }

      ['平均賠', al == null ? '—' : '−' + apMoney(Math.abs(al), 0, cur), '每筆', 'ap-dn'],
      ['賺賠比', aw != null && al ? apNum(aw / Math.abs(al), 1) : '—', '平均賺 ÷ 平均賠', ''],

    let list = trips.filter(t => (f.f === 'open' ? !t.closed : f.f === 'win' ? t.closed && t.total > 0 : f.f === 'lose' ? t.closed && t.total < 0 : true)

    const LIMIT = 8, total = list.length;
    if(!f.all) list = list.slice(0, LIMIT);
    const more = $('#apTripMore');
    more.hidden = total <= LIMIT;
    more.textContent = f.all ? '只看最近 ' + LIMIT + ' 筆' : '看全部 ' + total + ' 筆';

    const tag = k => k === '買進' ? 'buy' : (k === '停利' || k === '減碼') ? 'trim' : 'sell';
    const tw = cur !== '美元';
    $('#apEv').innerHTML = list.length ? `<thead><tr>
        <th class="lt">股票</th><th class="lt">進場</th><th class="lt">出場</th><th>抱幾天</th><th>損益</th><th>幾倍風險</th><th class="lt">怎麼結束的</th>
      </tr></thead><tbody>` + list.map(t => {
        const i = trips.indexOf(t);
        const buy = t.fills.find(e => e.kind === '買進');
        const end = t.closed
          ? `<span class="ap-tag ${tag(t.kind)}">${esc(t.kind)}</span> ${esc(t.why)}`
          : `<span class="ap-tag">還抱著</span>${t.sells ? ' 已先賣掉一部分' : ''}`;
        return `<tr class="row" data-i="${i}" aria-expanded="false" tabindex="0">
          <td class="lt nm"><span class="ap-chev">›</span>${esc(tw ? t.name : t.code)}<small>${esc(tw ? t.code : t.name)}</small></td>
          <td class="lt">${t.in ? apMD(t.in) : '—'}<small>${buy && buy.price != null ? apNum(buy.price) : ''}</small></td>
          <td class="lt">${t.closed ? apMD(t.out) : '<span class="ap-mute">—</span>'}</td>
          <td>${t.days == null ? '—' : t.days}</td>
          <td class="${apCls(t.total)}">${apSign(t.total, 0)}${t.pct != null ? '<small>' + apSign(t.pct, 1) + '%</small>' : ''}</td>
          <td class="${apCls(t.r)}">${t.r == null ? '—' : apSign(t.r, 1)}</td>
          <td class="why">${end}</td></tr>
          <tr class="more" data-for="${i}" hidden><td colspan="7">` + t.fills.map(e =>
            `<div class="fill"><span class="d">${apMD(e.date)}</span><span class="ap-tag ${tag(e.kind)}">${esc(e.kind)}</span>${e.src ? '<small>補</small>' : ''}
              <span>${apNum(e.shares, 0)} 股 @ ${apNum(e.price)}</span>`
            + (e.kind === '買進' ? (e.stop != null ? `<span class="ap-mute">停損設 ${apNum(e.stop)}</span>` : '')
               : `<span class="${apCls(e.pnl)}">${apSign(e.pnl, 0)}${e.r != null ? '（' + apSign(e.r, 1) + ' 倍風險）' : ''}</span><span class="ap-mute">${esc(e.why || '')}</span>`)
            + '</div>').join('')

  async function apDayLog(market, dates){
